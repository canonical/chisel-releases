summary: Integration tests for libxkbcommon-x11-0

execute: |
  rootfs="$(install-slices libxkbcommon-x11-0_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libxkbcommon-x11.so.0" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # The dynamic loader fails if any shared library libxkbcommon-x11 links against is missing.
  chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}"
