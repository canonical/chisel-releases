summary: Integration tests for dotnet-targeting-pack-10.0

execute: |
  rootfs="$(install-slices dotnet-targeting-pack-10.0_libs)"
  pack="$(echo "$rootfs"/usr/lib/dotnet/packs/Microsoft.NETCore.App.Ref/10.0.*)"

  # What the SDK compiles against: the reference assemblies, the analyzers
  # and the framework list. The dotnet-sdk-10.0 tests compile with them.
  test -e "$pack/ref/net10.0/System.Runtime.dll"
  test -e "$pack/data/FrameworkList.xml"
  test -e "$pack/data/PackageOverrides.txt"
  test -n "$(find "$pack/analyzers" -name '*.dll' -print -quit)"

  # The IntelliSense docs next to the reference assemblies stay out.
  test -z "$(find "$pack/ref" -name '*.xml' -print -quit)"
