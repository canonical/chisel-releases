summary: Integration tests for libbrotli1

execute: |
  rootfs="$(install-slices libbrotli1_brotlidec)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libbrotlidec.so.1" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"

  # Have the dynamic loader resolve every shared library libbrotlidec links
  # against; it fails if any is missing.
  chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}"
