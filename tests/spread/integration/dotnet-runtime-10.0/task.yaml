summary: Integration tests for dotnet-runtime-10.0

variants:
    - minimal
    - core
    - standard
    - tracing
    - debugging
    - kerberos
    - dev

environment:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

prepare: |
  . ./helpers.sh
  build_probe

execute: bash -eux ./test_${SPREAD_VARIANT}.sh
