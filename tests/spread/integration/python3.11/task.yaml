summary: Integration tests for Python3.11

environment:
  SLICE/core: "core"
  SLICE/standard: "standard"
  SLICE/utils: "utils"

execute: |
  # Test different slice installations
  echo "SLICE=${SLICE}"

  rootfs="$(install-slices python3.11_${SLICE})"

  cp test_${SLICE}.py "${rootfs}/"
  chroot "$rootfs" python3.11 /test_${SLICE}.py
