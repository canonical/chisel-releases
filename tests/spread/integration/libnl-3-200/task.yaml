summary: Integration tests for libnl-3-200

execute: |
  rootfs="$(install-slices libnl-3-200_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libnl-3.so.200" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # Have the dynamic loader resolve every shared library libnl-3 links
  # against; it fails if any is missing.
  output="$(chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}")"
  echo "$output"
  echo "$output" | grep -Fq "libc.so.6"
