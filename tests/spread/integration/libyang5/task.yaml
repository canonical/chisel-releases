summary: Integration tests for libyang5

execute: |
  rootfs="$(install-slices libyang5_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$loader"
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libyang.so.5" -print -quit)"
  test -n "$lib"

  # libyang loads its internal modules from here when a context is created.
  test -s "$rootfs/usr/share/yang/modules/libyang/ietf-yang-library@2019-01-04.yang"

  chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}"
