summary: Integration tests for dotnet-sdk-10.0

variants:
    - minimal
    - core
    - publish
    - standard

environment:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # the SDK keeps its config and NuGet settings here
  HOME: /root

execute: bash -eux ./test_${SPREAD_VARIANT}.sh
