summary: Integration tests for libllvm20

execute: |
  rootfs="$(install-slices libllvm20_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libLLVM.so.20.1" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # The dynamic loader fails if any library libLLVM links against is missing.
  chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}"
