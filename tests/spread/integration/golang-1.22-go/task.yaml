summary: Integration tests for golang-1.22-go

variants:
  - build-tools
  - cgo-tools
  - core
  - debug-tools
  - dist-tools
  - doc-tools
  - minimal
  - profiling-tools
  - testing-tools

execute: |
  export SLICE="$SPREAD_VARIANT"
  rootfs="$(bash -ex ./shared/prologue.sh)"
  export rootfs
  trap 'bash -ex ./shared/epilogue.sh' EXIT
  bash -ex "./test_${SPREAD_VARIANT}.sh"
