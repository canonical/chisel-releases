summary: Integration tests for postgresql-client-18

prepare: |
  export DEBIAN_FRONTEND=noninteractive
  apt-get update
  apt-get install -y postgresql-18 postgresql-contrib-18

variants:
  - bins
  - pg-dumpall
  - pg-verifybackup

restore: pg_ctlcluster 18 main stop || true

execute: bash -eux ./test_${SPREAD_VARIANT}.sh
