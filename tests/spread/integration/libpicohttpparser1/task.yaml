summary: Integration tests for libpicohttpparser1

execute: |
  rootfs="$(install-slices libpicohttpparser1_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libpicohttpparser.so.1" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # The soname link is made by the slice, not the deb, so it has to resolve.
  test -L "$lib"
  test -f "$lib"

  output="$(chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}")"
  echo "$output"
  echo "$output" | grep -Fq "libc.so.6"
