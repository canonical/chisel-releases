summary: Integration tests for libpython3.14

execute: |
  rootfs="$(install-slices libpython3.14_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libpython3.14.so.1.0" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # The soname symlink points at the library.
  test "$(readlink "$(dirname "$lib")/libpython3.14.so.1")" = "libpython3.14.so.1.0"

  # Have the dynamic loader resolve every shared library libpython links
  # against; it fails if any is missing.
  output="$(chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}")"
  echo "$output"
  echo "$output" | grep -Fq "libexpat.so.1"
  echo "$output" | grep -Fq "libz.so.1"
