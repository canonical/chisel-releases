summary: Integration tests for libxcb-util1

execute: |
  rootfs="$(install-slices libxcb-util1_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libxcb-util.so.1" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # The dynamic loader fails if any shared library libxcb-util links against is missing.
  chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}"
