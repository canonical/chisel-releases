summary: Integration tests for busybox-static

execute: |
  rootfs="$(install-slices busybox-static_bins)"

  chroot "${rootfs}" busybox-static echo "Success" > ./test

  test $(chroot "${rootfs}" busybox-static echo "Success") = "Success"
  test $(chroot "${rootfs}" busybox-static sh -c 'echo ahoy') = "ahoy"
