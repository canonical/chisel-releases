summary: Integration tests for Python3

environment:
  SLICE/core: "core"
  SLICE/standard: "standard"
  SLICE/utils: "utils"

execute: |
  # Test different slice installations
  echo "SLICE=${SLICE}"

  rootfs="$(install-slices python3_${SLICE})"

  cp ../python3.14/test_${SLICE}.py "$rootfs"
  if [ "$SLICE" == "utils" ]; then
    # python3_utils only ships the links, and the scripts run python3.14
    chroot "$rootfs" python3.14 /test_utils.py 3
  else
    chroot "$rootfs" python3 /test_${SLICE}.py
  fi
