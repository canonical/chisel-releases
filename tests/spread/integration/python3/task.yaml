summary: Integration tests for Python3

environment:
  SLICE/minimal: "minimal"
  SLICE/core: "core"
  SLICE/standard: "standard"
  SLICE/scripts: "scripts"

execute: |
  # Test different slice installations
  echo "SLICE=${SLICE}"

  rootfs="$(install-slices python3_${SLICE})"

  # minimal runs the core checks too, plus its own.
  test_slice="${SLICE/minimal/core}"
  cp ../python3.14/test_${test_slice}.py "$rootfs"
  if [ "$SLICE" == "scripts" ]; then
    # python3_scripts only ships the links, and the scripts run python3.14
    chroot "$rootfs" python3.14 /test_scripts.py 3
  else
    chroot "$rootfs" python3 /test_${test_slice}.py
  fi

  if [ "$SLICE" == "minimal" ]; then
    cp test_minimal.py "$rootfs"
    chroot "$rootfs" python3 /test_minimal.py
  fi
