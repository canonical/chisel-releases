summary: Integration tests for aspnetcore-runtime-10.0

variants:
    - minimal
    - core
    - standard

environment:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

prepare: |
  # the web app is built on the host and run on the chiselled runtime
  apt-get update
  apt-get install -y dotnet-sdk-10.0
  dotnet publish web_helloworld/Hello.csproj --configuration Release --no-self-contained --output web_helloworld/out

execute: bash -eux ./test_${SPREAD_VARIANT}.sh
