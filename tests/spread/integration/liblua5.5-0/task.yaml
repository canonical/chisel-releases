summary: Integration tests for liblua5.5-0

execute: |
  rootfs="$(install-slices liblua5.5-0_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$loader"

  # Have the dynamic loader resolve every shared library each lua library
  # links against; it fails if any is missing.
  for soname in liblua5.5.so.0 liblua5.5-c++.so.0; do
    lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/$soname" -print -quit)"
    test -n "$lib"
    output="$(chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}")"
    echo "$output"
    echo "$output" | grep -Fq "libc.so.6"
  done
