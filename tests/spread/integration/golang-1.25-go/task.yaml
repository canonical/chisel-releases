summary: Integration tests for golang-1.25-go

variants:
  - build-tools
  - cgo-tools
  - core
  - minimal
  - profiling-tools
  - testing-tools

environment:
  GOTOOLCHAIN: local

execute: |
  export SLICE="$SPREAD_VARIANT"
  rootfs="$(bash -ex ./shared/prologue.sh)"
  export rootfs
  trap 'bash -ex ./shared/epilogue.sh' EXIT
  bash -ex "./test_${SPREAD_VARIANT}.sh"
