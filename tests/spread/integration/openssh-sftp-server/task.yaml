summary: Integration tests for openssh-sftp-server

execute: |
  set -euo pipefail
  rootfs="$(install-slices openssh-sftp-server_bins)"
  mkdir -p "$rootfs/tmp" "$rootfs/dev"
  touch "$rootfs/dev/null"
  printf 'sftp-transfer-ok\n' > "$rootfs/tmp/source"

  for server in /usr/lib/openssh/sftp-server /usr/lib/sftp-server; do
    printf 'put /tmp/source /tmp/destination\n' |
      timeout 5 chroot "$rootfs" /usr/bin/sftp -D "$server" -b -
    cmp "$rootfs/tmp/source" "$rootfs/tmp/destination"
    rm "$rootfs/tmp/destination"
  done
