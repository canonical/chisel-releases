summary: Integration tests for python3-pyftpdlib

execute: |
  function wait_for_ftp(){
    sleep 0.3
    while ! nc -z 127.0.0.1 2121
    do
      test -d /proc/$pyftpdlib_pid || (echo "pyftpdlib exited early"; exit 1)
      sleep 1
    done
  }
  function cleanup(){
    while [[ -d /proc/$pyftpdlib_pid ]]; do
      kill $pyftpdlib_pid || true
      sleep 0.1
    done
  }
  # Still run the cleanup even on test failure.
  trap cleanup EXIT

  rootfs="$(install-slices python3-pyftpdlib_libs)"
  mkdir "${rootfs}/dev"
  mount --bind /dev "${rootfs}/dev"
  mkdir -p "${rootfs}"/srv/subdir
  echo "Test file" > "${rootfs}"/srv/subdir/test-file

  # Basic install smoke test

  chroot "${rootfs}" python3 -m pyftpdlib --help

  # Anonymous hosting

  chroot "${rootfs}" /usr/bin/python3 -m pyftpdlib \
    --debug \
    --interface=127.0.0.1 \
    --port=2121 \
    --directory=/srv &
  export pyftpdlib_pid=$!
  wait_for_ftp

  [[ "$(curl ftp://127.0.0.1:2121/subdir/test-file)" == "Test file" ]]

  cleanup

  # With login and file upload.

  chroot "${rootfs}" /usr/bin/python3 -m pyftpdlib \
    --debug \
    --interface=127.0.0.1 \
    --port=2121 \
    --directory=/srv \
    --write \
    --username=testy \
    --password=testy &
  export pyftpdlib_pid=$!
  wait_for_ftp

  [[ "$(curl ftp://testy:testy@127.0.0.1:2121/subdir/test-file)" == "Test file" ]]

  echo "Test upload" > test-upload
  curl -T test-upload ftp://testy:testy@127.0.0.1:2121/test-upload
  [[ "$(cat "${rootfs}/srv/test-upload")" == "$(cat test-upload)" ]]

  cleanup

  # FTPS, in a fresh rootfs with the TLS handlers.

  rootfs="$(install-slices python3-pyftpdlib_ftps)"
  mkdir "${rootfs}/dev"
  mount --bind /dev "${rootfs}/dev"
  mkdir -p "${rootfs}"/srv/subdir "${rootfs}/tls"
  echo "Test file" > "${rootfs}"/srv/subdir/test-file

  chroot "${rootfs}" python3 -c "
  import datetime
  from cryptography import x509
  from cryptography.x509.oid import NameOID
  from cryptography.hazmat.primitives import hashes, serialization
  from cryptography.hazmat.primitives.asymmetric import ec
  key = ec.generate_private_key(ec.SECP256R1())
  name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, '127.0.0.1')])
  now = datetime.datetime.now(datetime.timezone.utc)
  cert = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
          .public_key(key.public_key()).serial_number(x509.random_serial_number())
          .not_valid_before(now).not_valid_after(now + datetime.timedelta(days=1))
          .sign(key, hashes.SHA256()))
  open('/tls/key.pem', 'wb').write(key.private_bytes(
      serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8,
      serialization.NoEncryption()))
  open('/tls/cert.pem', 'wb').write(cert.public_bytes(serialization.Encoding.PEM))
  "

  chroot "${rootfs}" /usr/bin/python3 -m pyftpdlib \
    --debug \
    --interface=127.0.0.1 \
    --port=2121 \
    --directory=/srv \
    --tls \
    --keyfile=/tls/key.pem \
    --certfile=/tls/cert.pem \
    --tls-control-required \
    --tls-data-required &
  export pyftpdlib_pid=$!
  wait_for_ftp

  [[ "$(curl --ssl-reqd --insecure ftp://127.0.0.1:2121/subdir/test-file)" == "Test file" ]]

  # The server refuses a client that does not upgrade to TLS.
  if curl ftp://127.0.0.1:2121/subdir/test-file; then
    echo "plain FTP was accepted"
    exit 1
  fi

  cleanup
