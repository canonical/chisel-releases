summary: Integration tests for libtcnative-1

execute: |
  rootfs="$(install-slices libtcnative-1_libs)"

  # The multiarch directory and the dynamic loader's name differ per arch.
  lib="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/libtcnative-1.so.0.*" -print -quit)"
  loader="$(find "$rootfs" -maxdepth 4 -path "*/lib/*-linux-*/ld*.so.*" -print -quit)"
  test -n "$lib"
  test -n "$loader"

  # Both the soname symlink and the unversioned one tomcat loads point at
  # the library.
  test "$(readlink "$(dirname "$lib")/libtcnative-1.so.0")" = "$(basename "$lib")"
  test "$(readlink "$(dirname "$lib")/libtcnative-1.so")" = "$(basename "$lib")"

  # Have the dynamic loader resolve every shared library libtcnative-1 links
  # against; it fails if any is missing.
  output="$(chroot "$rootfs" "${loader#"$rootfs"}" --list "${lib#"$rootfs"}")"
  echo "$output"
  echo "$output" | grep -Fq "libapr-1.so.0"
  echo "$output" | grep -Fq "libssl.so.3"
  echo "$output" | grep -Fq "libcrypto.so.3"
