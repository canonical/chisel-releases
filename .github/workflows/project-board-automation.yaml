name: Project board automation

# Extra Review board automations that cannot be expressed with the built-in
# GitHub Project workflows, for this repository's PRs on the board:
#   1. Remove draft and closed (unmerged) PRs from the board, and archive merged
#      ones a few days after they merge, so the board holds the review queue.
#   2. Set the "Release" custom field to the PR base (target) branch name.
#   3. Set the status from the reviews: with no unaddressed change requests, 2+
#      approvals -> "Ready For Merge", 1 -> "Pending Second Review", 0 -> back to
#      "Awaiting Review". Only approvals from reviewers with push access count,
#      as for the branch protection's required reviews.
#
# This runs on a schedule (polling) rather than on pull_request events. That is
# deliberate: PRs in this repo target the release branches (e.g. 24.04, 25.10),
# not main, so a pull_request workflow living on main would never fire for them
# (the event only runs workflows that exist on the PR base branch). Polling from
# main avoids that and never executes PR-authored code. Same pattern as
# triage-prs.yaml.

on:
  schedule:
    # Every 1 hours. Ref: https://man7.org/linux/man-pages/man5/crontab.5.html
    - cron: "0 */1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log the changes, do not write them"
        type: boolean
        default: true

concurrency:
  group: project-board-automation
  cancel-in-progress: false

# Projects v2 writes require a token with "project" scope, so the default
# GITHUB_TOKEN is not enough. The repository secret ROCKSBOT_PR_TOKEN is used
# instead (same token used by triage-prs.yaml).
env:
  # Manual runs follow the dry_run input. Scheduled runs only write once the
  # repository variable PROJECT_BOARD_WRITE is set to "true".
  DRY_RUN: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
    || github.event_name != 'workflow_dispatch' && vars.PROJECT_BOARD_WRITE != 'true' }}
  ARCHIVE_MERGED_AFTER_DAYS: "7"
  PROJECT_OWNER: canonical
  PROJECT_NUMBER: "161"
  RELEASE_FIELD_NAME: "Release"
  STATUS_FIELD_NAME: "Status"
  STATUS_AWAITING_REVIEW: "Awaiting Review"
  STATUS_IN_PROGRESS: "In Progress"
  STATUS_PENDING_SECOND: "Pending Second Review"
  STATUS_READY_FOR_MERGE: "Ready For Merge"

jobs:
  update-project:
    name: Update Review board project
    if: github.repository_owner == 'canonical'
    runs-on: ubuntu-latest
    steps:
      - name: Sync release field and review status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ROCKSBOT_PR_TOKEN }}
          script: |
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);
            const releaseFieldName = process.env.RELEASE_FIELD_NAME;
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusPendingSecond = process.env.STATUS_PENDING_SECOND;
            const statusReadyForMerge = process.env.STATUS_READY_FOR_MERGE;
            const statusAwaitingReview = process.env.STATUS_AWAITING_REVIEW;
            const statusInProgress = process.env.STATUS_IN_PROGRESS;
            const dryRun = process.env.DRY_RUN === 'true';
            const archiveAfterMs =
              parseInt(process.env.ARCHIVE_MERGED_AFTER_DAYS, 10) * 24 * 60 * 60 * 1000;
            const repoName = `${context.repo.owner}/${context.repo.repo}`;
            if (dryRun) { console.log('Dry run: logging changes without writing them.'); }

            // 1. Resolve the project id and its fields.
            const projectData = await github.graphql(`
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2FieldCommon { id name dataType }
                        ... on ProjectV2SingleSelectField {
                          id name options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: projectOwner, number: projectNumber });

            const project = projectData.organization && projectData.organization.projectV2;
            if (!project) {
              throw new Error(
                `Project ${projectOwner}/${projectNumber} not found, or no access to it`
              );
            }
            const projectId = project.id;
            const fields = project.fields.nodes;

            const findField = (name) =>
              fields.find(f => f.name && f.name.toLowerCase() === name.toLowerCase());

            const releaseField = findField(releaseFieldName);
            const statusField = findField(statusFieldName);

            if (!releaseField) {
              throw new Error(`Could not find field "${releaseFieldName}" in project`);
            }
            if (!statusField || !statusField.options) {
              throw new Error(`Could not find single-select field "${statusFieldName}"`);
            }

            const statusOption = (name) => {
              const o = statusField.options.find(
                x => x.name.toLowerCase() === name.toLowerCase()
              );
              if (!o) {
                throw new Error(
                  `Status option "${name}" not found in field "${statusFieldName}"`
                );
              }
              return o.id;
            };
            const pendingSecondId = statusOption(statusPendingSecond);
            const readyForMergeId = statusOption(statusReadyForMerge);
            const awaitingReviewId = statusOption(statusAwaitingReview);
            const inProgressId = statusOption(statusInProgress);

            // Statuses this workflow is allowed to move a PR *out of* towards
            // "Awaiting Review" when there are 0 approvals and no outstanding
            // change requests. We demote from our own approval states, and also
            // from "In Progress" (set by the review-request automation) once the
            // author has addressed all change requests and a re-review is
            // pending. We never touch states like "Merged".
            const demotableStatusIds = new Set([
              pendingSecondId, readyForMergeId, inProgressId,
            ]);

            // 2. Page through all project items, pulling each PR's base branch,
            //    state, latest reviews, and current field values inline so we
            //    can decide what (if anything) needs updating.
            const setText = async (itemId, fieldId, value) => {
              if (dryRun) { return; }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { text: $value }
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId, fieldId, value });
            };

            const setSelect = async (itemId, fieldId, optionId) => {
              if (dryRun) { return; }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId, fieldId, optionId });
            };

            const archiveItem = async (itemId) => {
              if (dryRun) { return; }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!) {
                  archiveProjectV2Item(input: { projectId: $projectId, itemId: $itemId }) {
                    item { id }
                  }
                }
              `, { projectId, itemId });
            };

            const removeItem = async (itemId) => {
              if (dryRun) { return; }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!) {
                  deleteProjectV2Item(input: { projectId: $projectId, itemId: $itemId }) {
                    deletedItemId
                  }
                }
              `, { projectId, itemId });
            };

            let cursor = null;
            let processed = 0;
            let failed = 0;
            do {
              const page = await github.graphql(`
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 50, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          isArchived
                          fieldValues(first: 50) {
                            nodes {
                              ... on ProjectV2ItemFieldTextValue {
                                text field { ... on ProjectV2FieldCommon { id } }
                              }
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                optionId field { ... on ProjectV2FieldCommon { id } }
                              }
                            }
                          }
                          content {
                            ... on PullRequest {
                              number
                              state
                              isDraft
                              mergedAt
                              baseRefName
                              repository { nameWithOwner }
                              # last, not first: the connection is oldest first.
                              reviews(last: 100) {
                                nodes {
                                  state
                                  authorCanPushToRepository
                                  author { login }
                                  onBehalfOf(first: 10) {
                                    nodes { slug }
                                  }
                                }
                              }
                              reviewRequests(first: 50) {
                                nodes {
                                  requestedReviewer {
                                    ... on User { login }
                                    ... on Team { slug }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId, cursor });

              const items = page.node.items;
              for (const item of items.nodes) {
                const pr = item.content;
                // Only act on this repository's PRs; this skips non-PR items too.
                if (!pr || !pr.number) { continue; }
                if (!pr.repository || pr.repository.nameWithOwner !== repoName) { continue; }

                try {
                  // Closed without merging: no longer in the review queue.
                  if (pr.state === 'CLOSED') {
                    console.log(`PR #${pr.number}: closed -> removed from the board`);
                    await removeItem(item.id);
                    continue;
                  }
                  // Merged: the built-in workflow owns the "Merged" status; we only
                  // archive the item once it has been merged for a while.
                  if (pr.state === 'MERGED') {
                    const mergedFor = Date.now() - Date.parse(pr.mergedAt);
                    if (!item.isArchived && mergedFor > archiveAfterMs) {
                      console.log(`PR #${pr.number}: merged ${pr.mergedAt} -> archived`);
                      await archiveItem(item.id);
                    }
                    continue;
                  }
                  processed++;

                  // Drafts do not belong on the board. The built-in auto-add
                  // workflow adds the PR back when it is marked ready for review.
                  if (pr.isDraft) {
                    console.log(`PR #${pr.number}: draft -> removed from the board`);
                    await removeItem(item.id);
                    continue;
                  }

                  // Current field values on the item, keyed by field id.
                  const currentText = {};
                  const currentSelect = {};
                  for (const fv of item.fieldValues.nodes) {
                    if (!fv || !fv.field) { continue; }
                    if (typeof fv.text === 'string') {
                      currentText[fv.field.id] = fv.text;
                    } else if (typeof fv.optionId === 'string') {
                      currentSelect[fv.field.id] = fv.optionId;
                    }
                  }

                  // (a) release field -> base branch name (idempotent).
                  if (currentText[releaseField.id] !== pr.baseRefName) {
                    console.log(
                      `PR #${pr.number}: release "${currentText[releaseField.id] || ''}"` +
                      ` -> "${pr.baseRefName}"`
                    );
                    await setText(item.id, releaseField.id, pr.baseRefName);
                  }

                  // (b) status based on review state. Keep only the latest review
                  //     per author that carries a decision (approve / changes
                  //     requested); ignore plain comments and pending reviews. We
                  //     also remember the team(s) a review was submitted "on behalf
                  //     of" so a team re-request can clear it.
                  const latestByUser = new Map();
                  for (const r of pr.reviews.nodes) {
                    if (!r || !r.author || !r.author.login) { continue; }
                    if (r.state === 'COMMENTED' || r.state === 'PENDING') { continue; }
                    const teams = (r.onBehalfOf && r.onBehalfOf.nodes)
                      ? r.onBehalfOf.nodes.map(t => t && t.slug).filter(Boolean)
                      : [];
                    latestByUser.set(r.author.login, {
                      state: r.state, teams, canPush: r.authorCanPushToRepository,
                    });
                  }

                  // Pending (re-)review requests, split into individual users and
                  // teams. The author re-requesting either the user directly or a
                  // team the review was made on behalf of clears that reviewer.
                  const pendingUserLogins = new Set();
                  const pendingTeamSlugs = new Set();
                  if (pr.reviewRequests && pr.reviewRequests.nodes) {
                    for (const rr of pr.reviewRequests.nodes) {
                      const req = rr && rr.requestedReviewer;
                      if (!req) { continue; }
                      if (req.login) { pendingUserLogins.add(req.login); }
                      else if (req.slug) { pendingTeamSlugs.add(req.slug); }
                    }
                  }

                  // A reviewer is "re-requested" if their user is pending, or any
                  // team they reviewed on behalf of is pending.
                  const isReRequested = (login, review) => {
                    if (pendingUserLogins.has(login)) { return true; }
                    for (const slug of review.teams) {
                      if (pendingTeamSlugs.has(slug)) { return true; }
                    }
                    return false;
                  };

                  // Count approvals, but a re-requested approver's approval is
                  // stale (we presume the author changed something and asked them
                  // to look again), so it does not count until they re-approve.
                  // Like the required reviews, only reviewers with push access count.
                  let approvals = 0;
                  let changesRequested = 0;
                  for (const [login, review] of latestByUser) {
                    if (review.state === 'APPROVED') {
                      if (review.canPush && !isReRequested(login, review)) { approvals++; }
                    } else if (review.state === 'CHANGES_REQUESTED') {
                      changesRequested++;
                    }
                  }

                  // Are there unaddressed changes? A change request counts as
                  // unaddressed until the author re-requests that reviewer (directly
                  // or via the team they reviewed on behalf of). So the PR is clear
                  // to leave "In Progress" only when EVERY reviewer whose latest
                  // review is CHANGES_REQUESTED has been re-requested.
                  let hasUnaddressedChanges = false;
                  for (const [login, review] of latestByUser) {
                    if (review.state === 'CHANGES_REQUESTED' &&
                        !isReRequested(login, review)) {
                      hasUnaddressedChanges = true;
                      break;
                    }
                  }

                  const currentStatusId = currentSelect[statusField.id];

                  // While there are unaddressed changes the PR stays where it is
                  // ("In Progress" is owned by another workflow); we do not promote
                  // or demote. Once all change-requesting reviewers have been
                  // re-requested, the (non-stale) approval count decides:
                  //   2+ approvals -> Ready For Merge
                  //   1  approval  -> Pending Second Review
                  //   0  approvals -> Awaiting Review (demotion only).
                  let targetOptionId = null;
                  let targetLabel = null;
                  if (hasUnaddressedChanges) {
                    // Leave as-is.
                  } else if (approvals >= 2) {
                    targetOptionId = readyForMergeId;
                    targetLabel = statusReadyForMerge;
                  } else if (approvals === 1) {
                    targetOptionId = pendingSecondId;
                    targetLabel = statusPendingSecond;
                  } else if (demotableStatusIds.has(currentStatusId)) {
                    targetOptionId = awaitingReviewId;
                    targetLabel = statusAwaitingReview;
                  }

                  // Only write when we have a target and it actually differs.
                  if (targetOptionId && currentStatusId !== targetOptionId) {
                    console.log(
                      `PR #${pr.number}: ${approvals} approval(s), ` +
                      `${changesRequested} change request(s), ` +
                      `unaddressed=${hasUnaddressedChanges} -> ` +
                      `status "${targetLabel}"`
                    );
                    await setSelect(item.id, statusField.id, targetOptionId);
                  }
                } catch (err) {
                  failed++;
                  console.log(`PR #${pr.number}: failed: ${err.message}`);
                }
              }

              cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
            } while (cursor);

            console.log(`Processed ${processed} open PR item(s)${dryRun ? ' (dry run)' : ''}.`);
            if (failed) {
              core.setFailed(`${failed} item(s) failed, see the log above.`);
            }
