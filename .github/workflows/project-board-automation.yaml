name: Project board automation

# Keeps the "chisel-releases review" board (canonical org project 161) in sync with
# this repository's PRs, in place of the board's built-in workflows (auto-add, default
# status, Merged, changes requested). It only writes to the board, never to this
# repository. The logic and its tests live in .github/scripts/project-board-automation.
#
# The board's built-in workflows are already off, so until the PROJECT_BOARD_WRITE
# repository variable is "true" nothing adds new PRs to the board; the first run
# that applies catches up (adds, statuses, Release, removals).
#
# This runs on a schedule rather than on pull_request events: PRs here target the
# release branches, and a pull_request workflow only runs if it exists on the PR's
# base branch. Polling from main also never runs PR-authored code. Same pattern as
# forward-port-missing.yaml.

on:
  schedule:
    # Every hour. Ref: https://man7.org/linux/man-pages/man5/crontab.5.html
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log the changes, do not write them"
        type: boolean
        default: true

concurrency:
  group: project-board-automation
  cancel-in-progress: false

jobs:
  update-project:
    name: Update the chisel-releases review board
    if: github.repository_owner == 'canonical'
    runs-on: ubuntu-latest
    env:
      script: ".github/scripts/project-board-automation"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Sync the review board
        env:
          # GITHUB_TOKEN cannot access organization projects, so the board has a
          # ROCKsBot token of its own, with organization Projects read+write,
          # organization Members read (for the reviewer team) and read access to
          # this repository's pull requests, and no write scope on the repository.
          # ROCKsBot also needs write access to the project itself.
          GITHUB_TOKEN: ${{ secrets.ROCKSBOT_BOARD_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Only main writes: a manual run from another branch always dry-runs.
          # Manual runs from main follow the dry_run input. Scheduled runs only
          # write once the repository variable PROJECT_BOARD_WRITE is set to "true".
          APPLY: >-
            ${{ github.ref == 'refs/heads/main'
            && (github.event_name == 'workflow_dispatch' && !inputs.dry_run
            || github.event_name != 'workflow_dispatch' && vars.PROJECT_BOARD_WRITE == 'true') }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          ${{ env.script }}/project_board_automation.py "${args[@]}"
