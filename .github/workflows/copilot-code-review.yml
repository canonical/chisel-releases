name: Copilot code review setup

# Run by Copilot code review before it reviews a pull request. The trigger only
# exists so that the steps can be run by hand as a normal workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Copilot looks for a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This checkout is the pull request's code; nothing here may run anything from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Only the release branches have chisel.yaml; a pull request against main gets no
      # setup, and every step below is conditional on this one finding a release.
      - name: Find the release branch
        run: |
          [ -f chisel.yaml ] || { echo "no chisel.yaml: not a release branch"; exit 0; }
          echo "BASE=ubuntu-$(yq '.archives.ubuntu.version' chisel.yaml)" >> "$GITHUB_ENV"

      - if: env.BASE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: .main
          sparse-checkout: .github/copilot-review
          persist-credentials: false

      # Copilot's checkout is shallow; the base and the head are fetched with their full
      # history, a couple of megabytes here, so that the commit the pull request branched
      # from is known. The checkout keeps no credentials, so the job token reaches git
      # through the environment.
      - name: Fetch the base branch
        if: env.BASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!gh auth git-credential'
          git fetch --unshallow origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            "$(git rev-parse HEAD)"
          since="$(git merge-base "origin/$BASE" HEAD || echo "origin/$BASE")"
          echo "base: $BASE, comparing against: $since"
          echo "SINCE=$since" >> "$GITHUB_ENV"

      # Copilot reads instructions and skills from this checkout, so only the pull
      # request's slices and tests stay in it; everything else goes back to the commit it
      # branched from. A file added anywhere else is removed, and Copilot then declines
      # to review the pull request, since it cannot read that file for its diff.
      - name: Keep only the slice and test changes
        if: env.BASE
        run: git restore --source="$SINCE" --worktree -- . ':!slices/*.yaml' ':!tests'

      - name: Install the review instructions
        if: env.BASE
        run: |
          set -ex
          cp .main/.github/copilot-review/instructions.md .github/copilot-instructions.md
          rm -rf .main

      - if: env.BASE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: canonical/mason
          ref: 7b0fc402f94cdd6da9fcaff528bc6301da8624cc # v0.3.0
          path: .mason
          persist-credentials: false

      - name: Install the mason skill
        if: env.BASE
        run: |
          set -ex
          mkdir -p .github/skills
          cp -r .mason/skills/chisel-slice-reviewer .github/skills/
          rm -rf .mason
          ls -R .github/skills

      - if: env.BASE
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
