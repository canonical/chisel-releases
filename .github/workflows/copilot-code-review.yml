name: Copilot code review setup

# This job is run to setup copilot code review. It does not need any triggers. The
# 'workflow_dispatch' trigger below is a dummy. The single job in this workflow
# *must* be named 'copilot-setup-steps'.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Copilot checks a fork's pull request out itself after these steps, unless the
      # repository is already at the head commit, so the setup fetches the head by the
      # pull request number the job is given. A pull request from a branch of this
      # repository is checked out already.
      - name: Check out the pull request head
        run: |
          n="$(jq -r '.inputs.COPILOT_AGENT_PULL_REQUEST_NUMBER // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$n" ] || exit 0
          git fetch origin "refs/pull/$n/head"
          git -c advice.detachedHead=false switch --detach FETCH_HEAD

      - name: Find the release branch
        run: |
          [ -f chisel.yaml ] || exit 0
          echo "BASE=ubuntu-$(yq '.archives.ubuntu.version' chisel.yaml)" >> "$GITHUB_ENV"

      - name: Fetch the base branch
        if: env.BASE
        run: |
          git fetch --unshallow origin "$BASE" "$(git rev-parse HEAD)"
          since="$(git merge-base "origin/$BASE" HEAD || echo "origin/$BASE")"
          echo "SINCE=$since" >> "$GITHUB_ENV"

      # Copilot reads a pull request from a branch of this repository with the instructions
      # and skills in the checkout, so everything the pull request changed outside slices
      # and tests goes back to the branch point.
      - name: Keep only the slice and test changes
        if: env.BASE
        run: git restore --source="$SINCE" --worktree -- . ':!slices/*.yaml' ':!tests'

      # The skill lives outside the checkout, where the review reads it the same way for
      # every pull request. The release branches' .github/copilot-instructions.md names it.
      - name: Install mason/chisel-slice-reviewer skill
        if: env.BASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh skill install --dir /home/runner/skills canonical/mason chisel-slice-reviewer \
            --pin 7b0fc402f94cdd6da9fcaff528bc6301da8624cc # v0.3.0

      - name: Install uv
        if: env.BASE
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
