name: Copilot code review setup

# Run by Copilot code review before it reviews a pull request. The trigger only
# exists so that the steps can be run by hand as a normal workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Copilot looks for a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This checkout is the pull request's code; nothing here may run anything from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Copilot reads instructions and skills from this checkout, so only the pull
      # request's slices and tests stay in it; everything else goes back to the commit
      # it branched from, and what it added is emptied rather than removed, since Copilot
      # fails on a diff file it cannot read. The base is read off chisel.yaml, which only
      # the release branches have, and fetched with enough history to reach the branch
      # point; the job token goes through the environment since the checkout keeps none.
      - name: Keep only the slice and test changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -f chisel.yaml ]; then
            version="$(sed -n 's/^ *version: *//p' chisel.yaml | head -n 1)"
            case "$version" in
              [0-9][0-9].[0-9][0-9]) base="ubuntu-$version" ;;
              *) echo "cannot read the release from chisel.yaml: '$version'" >&2; exit 1 ;;
            esac
          else
            base=main
          fi
          echo "base branch: $base"
          git checkout --quiet --detach
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --depth=1 origin "+refs/heads/$base:refs/remotes/origin/$base"
          head="$(git rev-parse HEAD)"
          rounds=0
          until git merge-base "origin/$base" "$head" >/dev/null 2>&1 || [ "$rounds" -eq 8 ]; do
            rounds=$((rounds + 1))
            git fetch --deepen=64 origin "$base" "$head"
          done
          since="$(git merge-base "origin/$base" "$head" || echo "origin/$base")"
          echo "comparing against: $since"
          git diff --name-only --diff-filter=AMRT "$since" -- . \
              ':(exclude)slices/*.yaml' ':(exclude)tests' \
            | while IFS= read -r f; do
                if git cat-file -e "$since:$f" 2>/dev/null; then
                  rm -rf "$f" && git restore --source="$since" --worktree -- "$f"
                else
                  rm -f "$f" && : > "$f"
                fi
                echo "reverted: $f"
              done
          # Instruction files are read wherever they are, tests included.
          git diff --name-only "$since" -- slices tests \
            | grep -E '(^|/)(AGENTS|CLAUDE|GEMINI|REVIEW)\.md$' \
            | while IFS= read -r f; do : > "$f" && echo "emptied: $f"; done

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: .main
          sparse-checkout: .github/copilot-review
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: canonical/mason
          ref: 7b0fc402f94cdd6da9fcaff528bc6301da8624cc # v0.3.0
          path: .mason
          persist-credentials: false

      - name: Install the review instructions and the mason skill
        run: |
          set -ex
          cp .main/.github/copilot-review/instructions.md .github/copilot-instructions.md
          mkdir -p .github/skills
          cp -r .mason/skills/chisel-slice-reviewer .github/skills/
          rm -rf .main .mason
          ls -R .github/copilot-instructions.md .github/skills

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
