name: Copilot code review setup

# Run by Copilot code review before it reviews a pull request. The trigger only
# exists so that the steps can be run by hand as a normal workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Copilot looks for a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      main-branch-path: files-from-main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Find the release branch
        run: |
          [ -f chisel.yaml ] || exit 0
          echo "BASE=ubuntu-$(yq '.archives.ubuntu.version' chisel.yaml)" >> "$GITHUB_ENV"

      - name: Checkout main branch
        if: env.BASE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: ${{ env.main-branch-path }}
          sparse-checkout: .github/copilot-review
          persist-credentials: false

      # Copilot's checkout is shallow; the base and the head are fetched with their full
      # history, a couple of megabytes here, so that the commit the pull request branched
      # from is known.
      - name: Fetch the base branch
        if: env.BASE
        run: |
          git fetch --unshallow origin "$BASE" "$(git rev-parse HEAD)"
          since="$(git merge-base "origin/$BASE" HEAD || echo "origin/$BASE")"
          echo "SINCE=$since" >> "$GITHUB_ENV"

      # Copilot reads instructions and skills from this checkout, so only the pull
      # request's slices and tests stay in it; everything else goes back to the commit it
      # branched from. A file added anywhere else is removed, and Copilot then declines
      # to review the pull request, since it cannot read that file for its diff.
      - name: Keep only the slice and test changes
        if: env.BASE
        run: git restore --source="$SINCE" --worktree -- . ':!slices/*.yaml' ':!tests'

      - name: Install the review instructions
        if: env.BASE
        run: |
          cp ${{ env.main-branch-path }}/.github/copilot-review/instructions.md \
            .github/copilot-instructions.md
          rm -rf ${{ env.main-branch-path }}

      - name: Install the mason skill
        if: env.BASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh skill install --dir .github/skills canonical/mason chisel-slice-reviewer \
            --pin 7b0fc402f94cdd6da9fcaff528bc6301da8624cc # v0.3.0

      - name: Install uv
        if: env.BASE
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
