name: Test chisel-releases CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yaml"
      - ".github/scripts/validate-hints/**"
      - ".github/scripts/forward-port-missing/**"
      - ".github/scripts/install-slices/**"
      - ".github/scripts/project-board-automation/**"

jobs:
  test-validate-hints:
    name: Test validate hints workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          pip-install: -r .github/scripts/validate-hints/requirements.txt
      - run: pip install pytest
      - name: Run "validate-hints" unit tests
        run: |
          pytest .github/scripts/validate-hints/

  test-forward-port-missing:
    name: Test forward port missing workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          pip-install: -r .github/scripts/forward-port-missing/requirements.txt
      - run: pip install pytest
      - name: Run "forward-port-missing" unit tests
        run: |
          pytest .github/scripts/forward-port-missing/

  test-install-slices:
    name: Test install slices workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          pip-install: -r .github/scripts/install-slices/requirements.txt
      - run: pip install pytest
      - name: Run "install-slices" unit tests
        run: |
          pytest .github/scripts/install-slices/

  test-project-board-automation:
    name: Test project board automation workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run "project-board-automation" unit tests
        run: |
          pytest .github/scripts/project-board-automation/

  # TODO: add tests for remaining CI scripts
