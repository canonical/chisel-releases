# Reviewers requested by the "Triage PRs" workflow on PRs into release branches.
# This is not a GitHub CODEOWNERS file: nobody listed here gates a merge.

# Each entry lists reviewers, as GitHub logins or <org>/<team>, and the
# packages they review. They are requested on PRs which touch
# slices/<package>.yaml or tests/spread/integration/<package>/ of any listed
# package. A package listed in several entries gets all of their reviewers.
# Packages are keys with empty values. Globs only stand in for versions, so
# that unrelated packages are not matched, except for "*", which matches every
# PR.

# Everyone listed must be a collaborator of this repository (read access is
# enough), as GitHub rejects review requests for anyone else.

- reviewers: [canonical/slice-reviewers-guild]
  packages:
    "*":

# .NET
- reviewers: [dviererbe]
  packages:
    aspnetcore-runtime-*:
    aspnetcore-targeting-pack-*:
    dotnet-apphost-pack-*:
    dotnet-host:
    dotnet-host-*:
    dotnet-hostfxr-*:
    dotnet-runtime-*:
    dotnet-sdk-*:
    dotnet-targeting-pack-*:
    dotnet-templates-*:
    netstandard-targeting-pack-*:

