package: libpicohttpparser1

essential:
  libpicohttpparser1_copyright:

slices:
  libs:
    essential:
      libc6_libs:
    contents:
      /usr/lib/*-linux-*/libpicohttpparser.so.1.2:

      # The deb ships no soname link; ldconfig normally creates it from the
      # package's trigger.
      /usr/lib/aarch64-linux-gnu/libpicohttpparser.so.1:
        arch: [arm64]
        symlink: libpicohttpparser.so.1.2
      /usr/lib/arm-linux-gnueabihf/libpicohttpparser.so.1:
        arch: [armhf]
        symlink: libpicohttpparser.so.1.2
      /usr/lib/powerpc64le-linux-gnu/libpicohttpparser.so.1:
        arch: [ppc64el]
        symlink: libpicohttpparser.so.1.2
      /usr/lib/riscv64-linux-gnu/libpicohttpparser.so.1:
        arch: [riscv64]
        symlink: libpicohttpparser.so.1.2
      /usr/lib/s390x-linux-gnu/libpicohttpparser.so.1:
        arch: [s390x]
        symlink: libpicohttpparser.so.1.2
      /usr/lib/x86_64-linux-gnu/libpicohttpparser.so.1:
        arch: [amd64]
        symlink: libpicohttpparser.so.1.2

  copyright:
    contents:
      /usr/share/doc/libpicohttpparser1/copyright:
