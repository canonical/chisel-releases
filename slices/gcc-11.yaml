package: gcc-11

essential:
  - gcc-11_copyright

slices:
  gcc-11:
    # Note: `v3-essential` only works for chisel>=1.3.0
    v3-essential:
      binutils_assembler:
      binutils_linker:
      cpp-11_cc1:
      libgcc-11-dev_core:
      libgcc-11-dev_headers:
    contents:
      /usr/bin/aarch64-linux-gnu-gcc-11:
        arch: [arm64]
      /usr/bin/gcc-11:  # Symlink to ${ARCH_TRIPLET}-gcc-11
      /usr/bin/powerpc64le-linux-gnu-gcc-11:
        arch: [ppc64el]
      /usr/bin/s390x-linux-gnu-gcc-11:
        arch: [s390x]
      /usr/bin/x86_64-linux-gnu-gcc-11:
        arch: [amd64]
      /usr/lib/gcc/aarch64-linux-gnu/11/collect2:
        arch: [arm64]
      /usr/lib/gcc/aarch64-linux-gnu/11/liblto_plugin.so:
        arch: [arm64]
      /usr/lib/gcc/powerpc64le-linux-gnu/11/collect2:
        arch: [ppc64el]
      /usr/lib/gcc/powerpc64le-linux-gnu/11/liblto_plugin.so:
        arch: [ppc64el]
      /usr/lib/gcc/s390x-linux-gnu/11/collect2:
        arch: [s390x]
      /usr/lib/gcc/s390x-linux-gnu/11/liblto_plugin.so:
        arch: [s390x]
      /usr/lib/gcc/x86_64-linux-gnu/11/collect2:
        arch: [amd64]
      /usr/lib/gcc/x86_64-linux-gnu/11/liblto_plugin.so:
        arch: [amd64]

  copyright:
    essential:
      - gcc-11-base_copyright
    contents:
      # Symlink to gcc-11-base
      /usr/share/doc/gcc-11:
