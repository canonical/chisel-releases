package: gcc-11

essential:
  - gcc-11_copyright

slices:
  gcc-11:
    essential:
      - binutils_assembler
      - binutils_linker
      - cpp-11_cc1
      - libgcc-11-dev_core
      - libgcc-11-dev_headers
    contents:
      /usr/bin/*-linux-*-gcc-11:
      /usr/bin/gcc-11:  # Symlink to ${ARCH_TRIPLET}-gcc-11
      /usr/lib/gcc/*-linux-*/11/collect2:
      /usr/lib/gcc/*-linux-*/11/liblto_plugin.so:

  copyright:
    essential:
      - gcc-11-base_copyright
    contents:
      # Symlink to gcc-11-base
      /usr/share/doc/gcc-11:
