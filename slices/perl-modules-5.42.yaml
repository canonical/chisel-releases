      /usr/share/perl/5.42*/Symbol.pm:
      /usr/share/perl/5.42*/Text/**.pm:
      /usr/share/perl/5.42*/Tie/**.pm:
      /usr/share/perl/5.42*/XSLoader.pm:
      /usr/share/perl/5.42*/_charnames.pm:
      /usr/share/perl/5.42*/base.pm:
      /usr/share/perl/5.42*/builtin.pm:
      /usr/share/perl/5.42*/bytes.pm:
      /usr/share/perl/5.42*/charnames.pm:
