package: perl-modules-5.42

essential:
  perl-modules-5.42_copyright:

slices:
  # The _core slice contains the perl modules that are tightly
  # dependent upon each other. Splitting them into separate slices
  # would cause cyclic dependencies.
  core:
    hint: Tightly interdependent core modules
    essential:
      perl-base_modules:
    contents:
      /usr/share/perl/5.42:
      /usr/share/perl/5.42*/AutoLoader.pm:
      /usr/share/perl/5.42*/AutoSplit.pm:
      /usr/share/perl/5.42*/Carp.pm:
      /usr/share/perl/5.42*/Carp/**.pm:
      /usr/share/perl/5.42*/Class/**.pm:
      /usr/share/perl/5.42*/Compress/**.pm:
      /usr/share/perl/5.42*/DirHandle.pm:
      /usr/share/perl/5.42*/Exporter.pm:
      /usr/share/perl/5.42*/Exporter/**.pm:
      /usr/share/perl/5.42*/Fatal.pm:
      /usr/share/perl/5.42*/File/**.pm:
      /usr/share/perl/5.42*/FileCache.pm:
      /usr/share/perl/5.42*/FileHandle.pm:
      /usr/share/perl/5.42*/FindBin.pm:
      /usr/share/perl/5.42*/I18N/**.pm:
      /usr/share/perl/5.42*/IO/**.pm:
      /usr/share/perl/5.42*/IO/**.pod:
