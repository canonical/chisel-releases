package: gcc-14-s390x-linux-gnu

essential:
  gcc-14-s390x-linux-gnu_copyright:

slices:
  # NOTE: For this slice to work, you need to also provide the linker,
  #       the assembler and cc1 c compiler. The default ones are from
  #       `cpp-14-s390x-linux-gnu` and `binutils-s390x-linux-gnu` slices.
  #       Alternatively, use the architecture-independent `gcc-14_gcc-14` slice,
  #       which provides these dependencies and `/usr/bin/gcc-14`.
  #       Include `libc6-dev_core` slice to link against the standard C libraries.
  gcc-14:
    essential:
      libc6_libs:
      libgcc-14-dev_headers:
    contents:
      /usr/bin/s390x-linux-gnu-gcc-14:
      /usr/libexec/gcc-cross/s390x-linux-gnu/14/collect2:
        arch: [amd64, arm64, i386, ppc64el]
      /usr/libexec/gcc-cross/s390x-linux-gnu/14/liblto_plugin.so:
        arch: [amd64, arm64, i386, ppc64el]
      /usr/libexec/gcc/s390x-linux-gnu/14/collect2:
        arch: [s390x]
      /usr/libexec/gcc/s390x-linux-gnu/14/liblto_plugin.so:
        arch: [s390x]

  copyright:
    essential:
      gcc-14-base_copyright: {arch: [s390x]}
      gcc-14-s390x-linux-gnu-base_copyright: {arch: [amd64, arm64, i386, ppc64el]}
    contents:
      /usr/share/doc/gcc-14-s390x-linux-gnu:  # Symlink to a gcc-14 base package
