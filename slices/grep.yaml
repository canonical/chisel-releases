package: grep

essential:
  grep_copyright:

slices:
  bins:
    essential:
      libc6_libs:
      libpcre2-8-0_libs:
    contents:
      /usr/bin/grep:

  scripts:
    # These are shell scripts requiring a symlink from /usr/bin/dash to
    # /usr/bin/sh.
    # They are deprecated upstream in favour of grep -E, grep -F and grep -r,
    # and Debian only keeps them for backward compatibility, so they may be
    # dropped from the package.
    # See: https://manpages.ubuntu.com/manpages/noble/en/man1/grep.1.html
    essential:
      dash_bins:
      grep_bins:
    contents:
      /usr/bin/egrep:
      /usr/bin/fgrep:
      /usr/bin/rgrep:

  copyright:
    contents:
      /usr/share/doc/grep/copyright:
