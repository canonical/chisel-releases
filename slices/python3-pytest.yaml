package: python3-pytest

essential:
  python3-pytest_copyright:

slices:
  scripts:
    essential:
      python3-pytest_libs:
    contents:
      /usr/bin/py.test:
      /usr/bin/py.test-3:
      /usr/bin/pytest:
      /usr/bin/pytest-3:

  libs:
    essential:
      libpython3-stdlib_development-tools:
      libpython3-stdlib_pyrepl:
      python3-iniconfig_libs:
      python3-packaging_libs:
      python3-pluggy_libs:
      python3-pygments_libs:
      python3_core:
    contents:
      /usr/lib/python3/dist-packages/_pytest/**:
      /usr/lib/python3/dist-packages/py.py:
      /usr/lib/python3/dist-packages/pytest-*.dist-info/**:
      /usr/lib/python3/dist-packages/pytest/**:

  copyright:
    contents:
      /usr/share/doc/python3-pytest/copyright:
