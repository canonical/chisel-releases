package: dlt-viewer

essential:
  - dlt-viewer_copyright

slices:
  bins:
    essential:
      - dlt-viewer_libs
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      # Qt does not start without a platform plugin; offscreen needs no display.
      - libqt5gui5t64_offscreen
      - libqt5network5t64_libs
      - libqt5serialport5_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/bin/dlt-parser:
      /usr/bin/dlt-viewer:

  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/lib/*-linux-*/libqdlt.so:

  plugins:
    essential:
      - dlt-viewer_libs
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libqt5network5t64_libs
      - libqt5printsupport5t64_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/lib/*-linux-*/dlt-viewer/plugins/*.so:

  copyright:
    contents:
      /usr/share/doc/dlt-viewer/copyright:
