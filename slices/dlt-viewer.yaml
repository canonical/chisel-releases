package: dlt-viewer

essential:
  - dlt-viewer_copyright

slices:
  # For now, these binaries only support offscreen rendering and abort unless
  # QT_QPA_PLATFORM=offscreen is set. This is enough for headless use, such as dlt-viewer -s -c.
  # TODO: maybe support other Qt platforms, such as xcb, in slices of their own under bins.
  bins:
    essential:
      - dlt-viewer_offscreen

  offscreen:
    hint: Binaries with offscreen rendering only
    essential:
      - dlt-viewer_dlt-parser
      - dlt-viewer_dlt-viewer
      # Nothing links this; Qt loads the platform plugin at runtime.
      - libqt5gui5t64_offscreen

  dlt-parser:
    essential:
      - dlt-viewer_libs
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/bin/dlt-parser:

  dlt-viewer:
    essential:
      - dlt-viewer_libs
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libqt5network5t64_libs
      - libqt5serialport5_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/bin/dlt-viewer:

  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/lib/*-linux-*/libqdlt.so:

  plugins:
    essential:
      - dlt-viewer_libs
      - libc6_libs
      - libgcc-s1_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libqt5network5t64_libs
      - libqt5printsupport5t64_libs
      - libqt5widgets5t64_libs
      - libstdc++6_libs
    contents:
      /usr/lib/*-linux-*/dlt-viewer/plugins/*.so:

  copyright:
    contents:
      /usr/share/doc/dlt-viewer/copyright:
