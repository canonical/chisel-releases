package: rust-1.97-miri

essential:
  rust-1.97-miri_copyright:

slices:
  cargo-miri:
    essential:
      # /usr/bin/cargo-1.97-unstable-miri is a /bin/sh script, so we need
      # /bin from base-files_bin and sh from dash_bins
      base-files_bin:
      cargo-1.97_cargo:
      dash_bins:
      libc6_libs:
      libgcc-s1_libs:
      libstd-rust-1.97-dev_libs:
      rust-1.97-miri_miri:
      rust-1.97-src_src:
    contents:
      /usr/bin/cargo-1.97-unstable-miri:
      /usr/lib/rust-1.97/bin/cargo-miri:

  miri:
    essential:
      libc6_libs:
      libgcc-s1_libs:
      libstd-rust-1.97-dev_libs:
    contents:
      /usr/lib/rust-1.97/bin/miri:

  copyright:
    contents:
      /usr/share/doc/rust-1.97-miri/copyright:
