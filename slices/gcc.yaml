package: gcc

essential:
  - gcc_copyright

slices:
  gcc:
    essential:
      - gcc-11_gcc-11
    contents:
      /usr/bin/cc:
        symlink: /usr/bin/gcc
      /usr/bin/gcc:  # Symlink to gcc-11

  copyright:
    essential:
      - gcc-11-base_copyright
    contents:
      /usr/share/doc/gcc:  # Symlink to gcc
