      /usr/lib/dotnet/packs/Microsoft.NETCore.App.Ref/10.0.*/data/*:
      /usr/lib/dotnet/packs/Microsoft.NETCore.App.Ref/10.0.*/ref/net10.0/*.dll:

  copyright:
    contents:
      /usr/share/doc/dotnet-targeting-pack-10.0/copyright:
