# This is a nothing package but other packages reference this instead of
# libjpeg-turbo8, so it is included for convenience.
package: libjpeg8

essential:
  libjpeg8_copyright:

slices:
  libs:
    essential:
      libc6_libs:
    contents:
      /usr/lib/*-linux-*/libjpeg.so.8*:

  copyright:
    contents:
      /usr/share/doc/libjpeg8/copyright:
