package: libqt5network5t64

essential:
  - libqt5network5t64_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libgssapi-krb5-2_libs
      - libqt5core5t64_libs
      - libstdc++6_libs
      - zlib1g_libs
    v3-essential:
      libgcc-s1_libs: {arch: [armhf, riscv64]}
    contents:
      /usr/lib/*-linux-*/libQt5Network.so.5*:

  copyright:
    contents:
      /usr/share/doc/libqt5network5t64/copyright:
