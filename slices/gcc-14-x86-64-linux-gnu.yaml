package: gcc-14-x86-64-linux-gnu

essential:
  gcc-14-x86-64-linux-gnu_copyright:

slices:
  # NOTE: For this slice to work, you need to also provide the linker,
  #       the assembler and cc1 c compiler. The default ones are from
  #       `cpp-14-x86-64-linux-gnu` and `binutils-x86-64-linux-gnu` slices.
  #       Alternatively, use the architecture-independent `gcc-14_gcc-14` slice,
  #       which provides these dependencies and `/usr/bin/gcc-14`.
  #       Include `libc6-dev_core` slice to link against the standard C libraries.
  gcc-14:
    essential:
      libc6_libs:
      libgcc-14-dev_headers:
    contents:
      /usr/bin/x86_64-linux-gnu-gcc-14:
      /usr/libexec/gcc-cross/x86_64-linux-gnu/14/collect2:
        arch: [arm64, i386, ppc64el, s390x]
      /usr/libexec/gcc-cross/x86_64-linux-gnu/14/liblto_plugin.so:
        arch: [arm64, i386, ppc64el, s390x]
      /usr/libexec/gcc/x86_64-linux-gnu/14/collect2:
        arch: [amd64]
      /usr/libexec/gcc/x86_64-linux-gnu/14/liblto_plugin.so:
        arch: [amd64]

  copyright:
    essential:
      gcc-14-base_copyright: {arch: [amd64]}
      gcc-14-x86-64-linux-gnu-base_copyright: {arch: [arm64, i386, ppc64el, s390x]}
    contents:
      /usr/share/doc/gcc-14-x86-64-linux-gnu:  # Symlink to a gcc-14 base package
