package: libexpat1

essential:
  - libexpat1_copyright

slices:
  libs:
    essential:
      - libc6_libs
    contents:
      /usr/lib/*-linux-*/libexpat.so.1*:
      /usr/lib/*-linux-*/libexpatw.so.1*:

  expat:
    essential:
      - libc6_libs
    v3-essential:
      libgcc-s1_libs: {arch: [armhf]}
    contents:
      /usr/lib/*-linux-*/libexpat.so.1*:

  copyright:
    contents:
      /usr/share/doc/libexpat1/copyright:
