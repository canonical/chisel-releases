package: libfontconfig1

essential:
  libfontconfig1_copyright:

slices:
  libs:
    essential:
      fontconfig-config_config:
      libc6_libs:
      libexpat1_libs:
      libfreetype6_libs:
    contents:
      /usr/lib/*-linux-*/libfontconfig.so.1*:

  # TODO: in the next release give libs these essentials and drop this slice.
  # fontconfig links only libexpat and freetype, see libfreetype6_libs-v2.
  libs-v2:
    essential:
      fontconfig-config_config:
      libc6_libs:
      libexpat1_expat:
      libfreetype6_libs-v2:
    contents:
      /usr/lib/*-linux-*/libfontconfig.so.1*:

  copyright:
    contents:
      /usr/share/doc/libfontconfig1/copyright:
