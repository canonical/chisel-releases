package: coreutils-from-gnu

essential:
  coreutils-from-gnu_copyright:

# This pkg creates the usual coreutils paths as symlinks
# to the gnu-coreutils
slices:
  libs:
    essential:
      gnu-coreutils_libs:

  bins:
    essential:
      coreutils-from-gnu_basic-operations:
      coreutils-from-gnu_changing-file-attributes:
      coreutils-from-gnu_conditions:
      coreutils-from-gnu_delaying:
      coreutils-from-gnu_directory-listing:
      coreutils-from-gnu_file-name-manipulation:
      coreutils-from-gnu_file-space-usage:
      coreutils-from-gnu_formatting-file-contents:
      coreutils-from-gnu_modified-command-invocation:
      coreutils-from-gnu_numeric-operations:
      coreutils-from-gnu_operating-on-characters:
      coreutils-from-gnu_operating-on-fields:
      coreutils-from-gnu_operating-on-sorted-files:
      coreutils-from-gnu_output-of-entire-files:
      coreutils-from-gnu_output-of-parts-of-files:
      coreutils-from-gnu_printing-text:
      coreutils-from-gnu_redirection:
      coreutils-from-gnu_selinux-context:
      coreutils-from-gnu_special-file-types:
      coreutils-from-gnu_summarizing-files:
      coreutils-from-gnu_system-context:
      coreutils-from-gnu_user-information:
      coreutils-from-gnu_working-context:

  # Output of entire files -- These commands read and write entire files,
  # possibly transforming them in some way.
  # https://www.gnu.org/software/coreutils/manual/html_node/Output-of-entire-files.html
  output-of-entire-files:
    essential:
      coreutils-from-gnu_base32:
      coreutils-from-gnu_base64:
      coreutils-from-gnu_basenc:
      coreutils-from-gnu_cat:
      coreutils-from-gnu_nl-bin:
      coreutils-from-gnu_od-bin:
      coreutils-from-gnu_tac:

  # Formatting file contents -- These commands reformat the contents of files.
  # https://www.gnu.org/software/coreutils/manual/html_node/Formatting-file-contents.html
  formatting-file-contents:
    essential:
      coreutils-from-gnu_fmt:
      coreutils-from-gnu_fold:
      coreutils-from-gnu_pr-bin:

  # Output of parts of files -- These commands output pieces of the input.
  # https://www.gnu.org/software/coreutils/manual/html_node/Output-of-parts-of-files.html
  output-of-parts-of-files:
    essential:
      coreutils-from-gnu_csplit:
      coreutils-from-gnu_head:
      coreutils-from-gnu_split:
      coreutils-from-gnu_tail:

  # Summarizing files -- These commands generate just a few numbers representing
  # entire contents of files.
  # https://www.gnu.org/software/coreutils/manual/html_node/Summarizing-files.html
  summarizing-files:
    essential:
      coreutils-from-gnu_b2sum:
      coreutils-from-gnu_cksum:
      coreutils-from-gnu_md5sum:
      coreutils-from-gnu_sha1sum:
      coreutils-from-gnu_sha224sum:
      coreutils-from-gnu_sha256sum:
      coreutils-from-gnu_sha384sum:
      coreutils-from-gnu_sha512sum:
      coreutils-from-gnu_sum:
      coreutils-from-gnu_wc-bin:

  # Operating on sorted files -- These commands work with (or produce) sorted
  # files.
  # https://www.gnu.org/software/coreutils/manual/html_node/Operating-on-sorted-files.html
  operating-on-sorted-files:
    essential:
      coreutils-from-gnu_comm:
      coreutils-from-gnu_ptx:
      coreutils-from-gnu_shuf:
      coreutils-from-gnu_sort:
      coreutils-from-gnu_tsort:
      coreutils-from-gnu_uniq:

  # Operating on fields.
  # https://www.gnu.org/software/coreutils/manual/html_node/Operating-on-fields.html
  operating-on-fields:
    essential:
      coreutils-from-gnu_cut:
      coreutils-from-gnu_join:
      coreutils-from-gnu_paste:

  # Operating on characters -- These commands operate on individual characters.
  # https://www.gnu.org/software/coreutils/manual/html_node/Operating-on-characters.html
  operating-on-characters:
    essential:
      coreutils-from-gnu_expand:
      coreutils-from-gnu_tr-bin:
      coreutils-from-gnu_unexpand:

  # Directory listing -- This slice contains the ls command and its variants dir
  # and vdir, which list information about files.
  # https://www.gnu.org/software/coreutils/manual/html_node/Directory-listing.html
  directory-listing:
    essential:
      coreutils-from-gnu_dir:
      coreutils-from-gnu_dircolors:
      coreutils-from-gnu_ls-bin:
      coreutils-from-gnu_vdir:

  # Basic operations -- This slice contains the commands for basic file
  # manipulation: copying, moving (renaming), and deleting (removing).
  # https://www.gnu.org/software/coreutils/manual/html_node/Basic-operations.html
  basic-operations:
    essential:
      coreutils-from-gnu_cp-bin:
      coreutils-from-gnu_dd-bin:
      coreutils-from-gnu_install:
      coreutils-from-gnu_mv-bin:
      coreutils-from-gnu_rm-bin:
      coreutils-from-gnu_shred:

  # Special file types -- This slice contains commands which create special
  # types of files (and rmdir, which removes directories, one special file
  # type).
  # https://www.gnu.org/software/coreutils/manual/html_node/Special-file-types.html
  special-file-types:
    essential:
      coreutils-from-gnu_link:
      coreutils-from-gnu_ln-bin:
      coreutils-from-gnu_mkdir:
      coreutils-from-gnu_mkfifo:
      coreutils-from-gnu_mknod:
      coreutils-from-gnu_readlink:
      coreutils-from-gnu_rmdir:
      coreutils-from-gnu_unlink:

  # Changing file attributes -- These commands change file attributes.
  # https://www.gnu.org/software/coreutils/manual/html_node/Changing-file-attributes.html
  changing-file-attributes:
    essential:
      coreutils-from-gnu_chgrp:
      coreutils-from-gnu_chmod:
      coreutils-from-gnu_chown:
      coreutils-from-gnu_touch:

  # File space usage -- These commands report how much storage is in use or
  # available, report other file and file status information, and write buffers
  # to file systems.
  # https://www.gnu.org/software/coreutils/manual/html_node/File-space-usage.html
  file-space-usage:
    essential:
      coreutils-from-gnu_df-bin:
      coreutils-from-gnu_du-bin:
      coreutils-from-gnu_stat:
      coreutils-from-gnu_sync:
      coreutils-from-gnu_truncate:

  # Printing text -- This slice contains commands that display text strings.
  # https://www.gnu.org/software/coreutils/manual/html_node/Printing-text.html
  printing-text:
    essential:
      coreutils-from-gnu_echo:
      coreutils-from-gnu_printf:
      coreutils-from-gnu_yes:

  # Conditions -- This slice contains commands that are primarily useful for
  # their exit status, rather than their output. Thus, they are often used as
  # the condition of shell if statements, or as the last command in a pipeline.
  # https://www.gnu.org/software/coreutils/manual/html_node/Conditions.html
  conditions:
    essential:
      coreutils-from-gnu_expr:
      coreutils-from-gnu_false:
      coreutils-from-gnu_test:
      coreutils-from-gnu_true:

  # Redirection -- This slice contains the tee command.
  # https://www.gnu.org/software/coreutils/manual/html_node/Redirection.html
  redirection:
    essential:
      coreutils-from-gnu_tee:

  # File name manipulation -- This slice contains commands that manipulate file
  # names.
  # https://www.gnu.org/software/coreutils/manual/html_node/File-name-manipulation.html
  file-name-manipulation:
    essential:
      coreutils-from-gnu_basename:
      coreutils-from-gnu_dirname:
      coreutils-from-gnu_mktemp:
      coreutils-from-gnu_pathchk:
      coreutils-from-gnu_realpath:

  # Working context -- This slice contains commands that display or alter the
  # context in which you are working: the current directory, the terminal
  # settings, and so forth.
  # https://www.gnu.org/software/coreutils/manual/html_node/Working-context.html
  working-context:
    essential:
      coreutils-from-gnu_printenv:
      coreutils-from-gnu_pwd:
      coreutils-from-gnu_stty:
      coreutils-from-gnu_tty:

  # User information -- This slice contains commands that print user-related
  # information: logins, groups, and so forth.
  # https://www.gnu.org/software/coreutils/manual/html_node/User-information.html
  user-information:
    essential:
      coreutils-from-gnu_groups:
      coreutils-from-gnu_id-bin:
      coreutils-from-gnu_logname:
      coreutils-from-gnu_pinky:
      coreutils-from-gnu_users:
      coreutils-from-gnu_who:
      coreutils-from-gnu_whoami:

  # System context -- This slice contains commands that print or change
  # system-wide information.
  # https://www.gnu.org/software/coreutils/manual/html_node/System-context.html
  system-context:
    essential:
      coreutils-from-gnu_arch:
      coreutils-from-gnu_date:
      coreutils-from-gnu_hostid:
      coreutils-from-gnu_nproc:
      coreutils-from-gnu_uname:

  # SELinux context -- This slice contains commands for operations with SELinux
  # contexts.
  # https://www.gnu.org/software/coreutils/manual/html_node/SELinux-context.html
  selinux-context:
    essential:
      coreutils-from-gnu_chcon:
      coreutils-from-gnu_runcon:

  # Modified command invocation -- This slice contains commands that run other
  # commands in some context different than the current one: a modified
  # environment, as a different user, etc.
  # https://www.gnu.org/software/coreutils/manual/html_node/Modified-command-invocation.html
  modified-command-invocation:
    essential:
      coreutils-from-gnu_chroot:
      coreutils-from-gnu_env:
      coreutils-from-gnu_nice:
      coreutils-from-gnu_nohup:
      coreutils-from-gnu_stdbuf:
      coreutils-from-gnu_timeout:

  # Delaying.
  # https://www.gnu.org/software/coreutils/manual/html_node/Delaying.html
  delaying:
    essential:
      coreutils-from-gnu_sleep:

  # Numeric operations -- These programs do numerically-related operations.
  # https://www.gnu.org/software/coreutils/manual/html_node/Numeric-operations.html
  numeric-operations:
    essential:
      coreutils-from-gnu_factor:
      coreutils-from-gnu_numfmt:
      coreutils-from-gnu_seq:

  # Single-binary slices

  env:
    essential:
      gnu-coreutils_env:
    contents:
      /usr/bin/env:

  expr:
    essential:
      gnu-coreutils_expr:
    contents:
      /usr/bin/expr:

  mkdir:
    essential:
      gnu-coreutils_mkdir:
    contents:
      /usr/bin/mkdir:

  echo:
    essential:
      gnu-coreutils_echo:
    contents:
      /usr/bin/echo:

  # NOTE: slice names must have at least 3 characters, so we can't just call this `ln`
  ln-bin:
    essential:
      gnu-coreutils_ln-bin:
    contents:
      /usr/bin/ln:

  rm-bin:
    essential:
      gnu-coreutils_rm-bin:
    contents:
