package: dpkg

essential:
  dpkg_copyright:

slices:
  bins:
    essential:
      coreutils_rm-bin:
      diffutils_bins:  # used by dpkg -i
      dpkg_config:
      dpkg_divert:
      dpkg_realpath:
      dpkg_start-stop-daemon:
      dpkg_tables:
      dpkg_update-alternatives:
      dpkg_var:
      libbz2-1.0_libs:
      libc-bin_ldconfig:
      libc6_libs:
      liblzma5_libs:
      libmd0_libs:
      libselinux1_libs:
      libzstd1_libs:
      tar_tar:
      zlib1g_libs:
    contents:
      /usr/bin/dpkg:
      /usr/bin/dpkg-deb:
      /usr/bin/dpkg-query:
      /usr/bin/dpkg-split:
      /usr/bin/dpkg-statoverride:
      /usr/bin/dpkg-trigger:

  start-stop-daemon:
    hint: Start and stop system demon programs
    essential:
      libc6_libs:
    contents:
      /usr/sbin/start-stop-daemon:

  update-alternatives:
    hint: Maintain symbolic links for commands
    essential:
      libc6_libs:
    contents:
      /usr/bin/update-alternatives:

  realpath:
    hint: Resolve path with dpkg root support
    essential:
      libc6_libs:
    contents:
      /usr/bin/dpkg-realpath:

  divert:
    hint: Override a file with a diverted version
    essential:
      libc6_libs:
      libmd0_libs:
    contents:
      /usr/bin/dpkg-divert:

  config:
    contents:
      /etc/dpkg/dpkg.cfg:
      /etc/dpkg/dpkg.cfg.d/:

  locales:
    essential:
      dpkg_bins:
    contents:
      /usr/share/locale/**/dpkg.mo:

  scripts:
    hint: Helper scripts shipped with dpkg
    essential:
      dpkg_db-backup:
      dpkg_db-keeper:
      dpkg_maintscript-helper:

  sh-lib:
    hint: Shared shell functions for dpkg scripts
    essential:
      coreutils_basename:
    contents:
      # Sourced by the dpkg scripts for their messages and colours.
      /usr/share/dpkg/sh/dpkg-error.sh:

  maintscript-helper:
    hint: Maintainer script helper for conffiles
    essential:
      base-files_bin:
      coreutils_bins:
      dash_bins:
      dpkg_bins:
      dpkg_sh-lib:
      findutils_bins:
      grep_bins:
      sed_bins:
    contents:
      /usr/bin/dpkg-maintscript-helper:

  db-backup:
    hint: Back up the dpkg database
    essential:
      base-files_bin:
      coreutils_bins:
      dash_bins:
      debianutils_savelog:
      diffutils_cmp:
      dpkg_sh-lib:
      # savelog compresses the older backups
      gzip_bins:
      tar_tar:
    contents:
      /usr/libexec/dpkg/dpkg-db-backup:

  db-keeper:
    hint: Record dpkg database changes in git
    essential:
      base-files_bin:
      dash_bins:
      dpkg_sh-lib:
    contents:
      # git is optional: without it the script does nothing
      /usr/libexec/dpkg/dpkg-db-keeper:

  tables:
    contents:
      /usr/share/dpkg/*table:

  var:
    # /var/log is required for dpkg to write logs to
    essential:
      base-files_var:
    # Directories that are included in the tarball because they need to exist in /var
    contents:
      /var/lib/dpkg/alternatives/:
      /var/lib/dpkg/info/:
      /var/lib/dpkg/parts/:
      /var/lib/dpkg/updates/:

  maintscript-support:
    essential:
      base-files_bin:
      coreutils_bins:
      dpkg_bins:
      dpkg_maintscript-helper:
      sed_bins:

  copyright:
    contents:
      /usr/share/doc/dpkg/copyright:
