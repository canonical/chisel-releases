package: librabbitmq4

essential:
  librabbitmq4_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libssl4_libs:
    contents:
      # librabbitmq.so.4 is a symlink to the real librabbitmq.so.0.* file
      /usr/lib/*-linux-*/librabbitmq.so.0*:
      /usr/lib/*-linux-*/librabbitmq.so.4*:

  copyright:
    contents:
      /usr/share/doc/librabbitmq4/copyright:
