package: librabbitmq4

essential:
  librabbitmq4_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libssl3t64_libs:
    contents:
      # the real file is librabbitmq.so.0.15.0; librabbitmq.so.4 links to it
      /usr/lib/*-linux-*/librabbitmq.so.0*:
      /usr/lib/*-linux-*/librabbitmq.so.4*:

  copyright:
    contents:
      /usr/share/doc/librabbitmq4/copyright:
