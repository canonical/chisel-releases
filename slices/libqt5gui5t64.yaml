package: libqt5gui5t64

essential:
  - libqt5gui5t64_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      # libQt5Gui links libGLESv2 on armhf and libGL everywhere else.
      - libgl1_libs
      - libgles2_libs
      - libharfbuzz0b_libs
      - libmd4c0_libs
      - libpng16-16t64_libs
      - libqt5core5t64_libs
      - libstdc++6_libs
      - zlib1g_libs
    contents:
      /usr/lib/*-linux-*/libQt5Gui.so.5*:

  offscreen:
    essential:
      - libc6_libs
      - libfontconfig1_libs
      - libfreetype6_libs
      - libgcc-s1_libs
      # libgl1 and libx11-6 are not linked on armhf, where Qt uses GLES and has no GLX.
      - libgl1_libs
      - libglib2.0-0t64_core
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libstdc++6_libs
      - libx11-6_libs
    contents:
      /usr/lib/*-linux-*/qt5/plugins/platforms/libqoffscreen.so:

  copyright:
    contents:
      /usr/share/doc/libqt5gui5t64/copyright:
