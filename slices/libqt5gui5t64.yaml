package: libqt5gui5t64

essential:
  libqt5gui5t64_copyright:

slices:
  libs:
    # Qt is built against OpenGL ES on armhf and against desktop OpenGL elsewhere.
    essential:
      libc6_libs:
      libgcc-s1_libs: {arch: [amd64, armhf, i386]}
      libgl1_libs: {arch: [amd64, arm64, i386, ppc64el, riscv64, s390x]}
      libgles2_libs: {arch: [armhf]}
      libharfbuzz0b_libs:
      libmd4c0_libs:
      libpng16-16t64_libs:
      libqt5core5t64_libs:
      libstdc++6_libs:
      zlib1g_libs:
    contents:
      /usr/lib/*-linux-*/libQt5Gui.so.5*:

  offscreen:
    essential:
      libc6_libs:
      libfontconfig1_libs:
      libfreetype6_libs:
      libgcc-s1_libs: {arch: [armhf, i386]}
      libgl1_libs: {arch: [amd64, arm64, i386, ppc64el, riscv64, s390x]}
      libglib2.0-0t64_core:
      libqt5core5t64_libs:
      libqt5gui5t64_libs:
      libstdc++6_libs:
      libx11-6_libs: {arch: [amd64, arm64, i386, ppc64el, riscv64, s390x]}
    contents:
      /usr/lib/*-linux-*/qt5/plugins/platforms/libqoffscreen.so:

  copyright:
    contents:
      /usr/share/doc/libqt5gui5t64/copyright:
