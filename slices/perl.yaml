package: perl

essential:
  perl_copyright:

slices:
  bins:
    hint: User facing Perl utility scripts
    essential:
      perl_encodings:
      perl_pod:
      perl_ptar:
      perl_scripts:
      perl_zip:

  encodings:
    hint: Encoding conversion and JSON tools
    essential:
      libperl5.42_standard:
      perl-base_bins:
    contents:
      /usr/bin/enc2xs:
      /usr/bin/encguess:
      /usr/bin/json_pp:
      /usr/bin/piconv:

  ptar:
    hint: Tar archive creation and inspection
    essential:
      libperl5.42_standard:
      perl-base_bins:
    contents:
      /usr/bin/ptar:
      /usr/bin/ptardiff:
      /usr/bin/ptargrep:

  pod:
    hint: POD documentation conversion tools
    essential:
      libperl5.42_standard:
      perl-base_bins:
    contents:
      /usr/bin/pod2html:
      /usr/bin/pod2man:
      /usr/bin/pod2text:
      /usr/bin/pod2usage:
      /usr/bin/podchecker:

  zip:
    hint: Zip archive packing and inspection tools
    essential:
      libperl5.42_standard:
      perl-base_bins:
    contents:
      /usr/bin/streamzip:
      /usr/bin/zipdetails:

  scripts:
    hint: Perl development and CPAN scripts
    essential:
      libperl5.42_standard:
      perl-base_bins:
      perl_config:
    contents:
      /usr/bin/corelist:
      /usr/bin/cpan:
      /usr/bin/h2ph:
      /usr/bin/h2xs:
      /usr/bin/instmodsh:
      /usr/bin/libnetcfg:
      /usr/bin/perlbug:
      /usr/bin/perldoc:
      /usr/bin/perlivp:
      # hard link
      /usr/bin/perlthanks: {copy: /usr/bin/perlbug}
      /usr/bin/pl2pm:
      /usr/bin/prove:
      /usr/bin/shasum:
      /usr/bin/splain:
      /usr/bin/xsubpp:

  config:
    hint: Libnet network configuration file
    contents:
      /etc/perl/Net/libnet.cfg:

  copyright:
    hint: Perl package license text
    contents:
      /usr/share/doc/perl/copyright:
