package: python3-cryptography

essential:
  python3-cryptography_copyright:

slices:
  libs:
    essential:
      # The deb also depends on python3-bcrypt, which cryptography imports
      # only optionally, for OpenSSH key derivation.
      libc6_libs:
      libgcc-s1_libs:
      libpython3-stdlib_crypto:
      libssl4_libs:
      # The Rust extension imports _cffi_backend when it loads.
      python3-cffi-backend_libs:
      python3-minimal_python3:
    contents:
      /usr/lib/python3/dist-packages/cryptography-*.dist-info/**:
      /usr/lib/python3/dist-packages/cryptography/**:

  copyright:
    contents:
      /usr/share/doc/python3-cryptography/copyright:
