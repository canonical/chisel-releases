package: libllvm15

essential:
  - libllvm15_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libedit2_libs
      - libffi8_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - libtinfo6_libs
      - libxml2_libs
      - zlib1g_libs
    # Architecture-specific essentials require Chisel >= 1.3.0.
    v3-essential:
      libatomic1_libs: {arch: [i386, riscv64]}
    contents:
      /usr/lib/*-linux-*/libLLVM-15.so.1:

  copyright:
    contents:
      /usr/share/doc/libllvm15/copyright:
