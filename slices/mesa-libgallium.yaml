      libc6_libs:
      libdrm-amdgpu1_libs:
      libdrm-intel1_libs: {arch: [amd64, i386]}
      libdrm2_libs:
      libelf1t64_libs:
      libexpat1_libs:
      libgcc-s1_libs:
      libllvm21_libs:
      libsensors5_libs:
      libstdc++6_libs:
      libx11-xcb1_libs:
      libxcb-dri3-0_libs:
      libxcb-present0_libs:
      libxcb-randr0_libs:
      libxcb-sync1_libs:
      libxcb-xfixes0_libs:
      libxcb1_libs:
      libxshmfence1_libs:
      libzstd1_libs:
      zlib1g_libs:
    contents:
      /usr/lib/*-linux-*/libgallium-*.so:

  copyright:
    contents:
      /usr/share/doc/mesa-libgallium/copyright:
