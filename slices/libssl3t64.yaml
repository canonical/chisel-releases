package: libssl3t64

essential:
  libssl3t64_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libzstd1_libs:
      openssl-provider-legacy_libs:
      zlib1g_libs:
    contents:
      /usr/lib/*-linux-*/engines-3/afalg.so:
      /usr/lib/*-linux-*/engines-3/loader_attic.so:
      # /usr/lib/*-linux-*/engines-3/padlock.so: # only available on arm64 and i386
      /usr/lib/*-linux-*/libcrypto.so.3*:
      /usr/lib/*-linux-*/libssl.so.3*:

  copyright:
    contents:
      /usr/share/doc/libssl3t64/copyright:
