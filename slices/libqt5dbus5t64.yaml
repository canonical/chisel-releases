package: libqt5dbus5t64

essential:
  - libqt5dbus5t64_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libdbus-1-3_libs
      - libqt5core5t64_libs
      - libstdc++6_libs
    v3-essential:
      libgcc-s1_libs: {arch: [armhf, riscv64]}
    contents:
      /usr/lib/*-linux-*/libQt5DBus.so.5*:

  copyright:
    contents:
      /usr/share/doc/libqt5dbus5t64/copyright:
