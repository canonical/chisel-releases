package: libharfbuzz0b

essential:
  libharfbuzz0b_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libfreetype6_libs:
      libglib2.0-0t64_libs:
      libgraphite2-3_libs:
    contents:
      /usr/lib/*-linux-*/libharfbuzz.so.0*:

  # libharfbuzz.so.0 with only the essentials it links. use this instead of libs.
  harfbuzz:
    essential:
      libc6_libs:
      libfreetype6_freetype:
      libglib2.0-0t64_core:
      libgraphite2-3_libs:
    contents:
      /usr/lib/*-linux-*/libharfbuzz.so.0*:

  copyright:
    contents:
      /usr/share/doc/libharfbuzz0b/copyright:
