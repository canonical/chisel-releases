package: libharfbuzz0b

essential:
  libharfbuzz0b_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libfreetype6_libs:
      libglib2.0-0t64_libs:
      libgraphite2-3_libs:
    contents:
      /usr/lib/*-linux-*/libharfbuzz.so.0*:

  # TODO: in the next release give libs these essentials and drop this slice.
  # harfbuzz links only libglib-2.0, not gio or gobject. check the users of
  # libs for a gio or gobject need they only meet through harfbuzz first.
  harfbuzz:
    essential:
      libc6_libs:
      libfreetype6_freetype:
      libglib2.0-0t64_core:
      libgraphite2-3_libs:
    contents:
      /usr/lib/*-linux-*/libharfbuzz.so.0*:

  copyright:
    contents:
      /usr/share/doc/libharfbuzz0b/copyright:
