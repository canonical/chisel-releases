package: libharfbuzz0b

essential:
  libharfbuzz0b_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      libfreetype6_libs:
      libglib2.0-0t64_libs:
      libgraphite2-3_libs:
    contents:
      /usr/lib/*-linux-*/libharfbuzz.so.0*:

  # v2 of libs: the same files, with only the essentials libharfbuzz links.
