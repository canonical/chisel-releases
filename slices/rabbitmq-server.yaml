package: rabbitmq-server

essential:
  rabbitmq-server_copyright:

# NOTE: erlang* packages do not exist for i386, so the erlang essentials are
# restricted to the arches that have them.
slices:
  # The broker alone: it boots with no plugins and serves AMQP. The erlang
  # applications are the ones rabbit lists in plugins/rabbit-*/ebin/rabbit.app,
  # the optional plugins live in modules and the tools in cli.
  minimal:
    hint: Broker without plugins or cli
    essential:
      base-files_bin:
      coreutils_basename:
      coreutils_date:
      coreutils_df-bin:  # disk free monitor
      coreutils_dirname:
      coreutils_expr:
      coreutils_readlink:
      dash_bins:
      erlang-base_bins: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-crypto_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-inets_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-os-mon_bins: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-public-key_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-runtime-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-ssl_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-syntax-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      libc-bin_getconf:  # memory page size
      libc-bin_nsswitch:
      netbase_default-hosts:
      rabbitmq-server_config:
    contents:
      /usr/lib/rabbitmq/bin/rabbitmq-defaults:
      /usr/lib/rabbitmq/bin/rabbitmq-env:
      /usr/lib/rabbitmq/bin/rabbitmq-server:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/amqp10_common-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/aten-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/cowlib-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/credentials_obfuscation-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/cuttlefish-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/enough-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/gen_batch_server-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/horus-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/khepri-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/khepri_mnesia_migration-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/observer_cli-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/osiris-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/ra-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/rabbit-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/rabbit_common-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/rabbitmq_prelaunch-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/ranch-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/recon-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/redbug-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/seshat-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/stdout_formatter-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/syslog-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/sysmon_handler-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/systemd-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/thoas-*/**:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-defaults:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-env:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-server:
      /var/lib/rabbitmq/:
      # The following is a cookie file necessary for rabbitmq-server to work
      # The contents of that cookie file should be generated by the command:
      # openssl rand -base64 -out /var/lib/rabbitmq/.erlang.cookie 42
      /var/lib/rabbitmq/.erlang.cookie: { text: DUMMY, mode: 0400 }
      /var/lib/rabbitmq/mnesia/: { mode: 0750 }
      /var/log/rabbitmq/:

  # The elixir tools on top of the broker. They load the broker's own code
  # (rabbit_env and friends), and reach a node over erlang distribution, so a
  # core rootfs also manages a broker running in another one.
  core:
    hint: Broker and cli
    essential:
      rabbitmq-server_minimal:
    contents:
      /usr/lib/rabbitmq/bin/rabbitmq-diagnostics:
      /usr/lib/rabbitmq/bin/rabbitmq-plugins:
      /usr/lib/rabbitmq/bin/rabbitmq-queues:
      /usr/lib/rabbitmq/bin/rabbitmq-server-wait:
      /usr/lib/rabbitmq/bin/rabbitmq-streams:
      /usr/lib/rabbitmq/bin/rabbitmq-upgrade:
      /usr/lib/rabbitmq/bin/rabbitmqctl:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmq-diagnostics:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmq-plugins:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmq-queues:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmq-streams:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmq-upgrade:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/rabbitmqctl:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-diagnostics:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-plugins:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-queues:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-streams:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmq-upgrade:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/rabbitmqctl:

  standard:
    hint: Broker, cli and every plugin
    essential:
      rabbitmq-server_core:
      rabbitmq-server_modules:

  # The rest: the /usr/sbin wrappers that switch to the rabbitmq user, the
  # pacemaker resource agent, vmware-rabbitmq and shell completion.
  dev:
    hint: Everything, with the root wrappers
    essential:
      base-passwd_data:
      coreutils_bins:
      grep_bins:
      passwd_bins:
      rabbitmq-server_autocomplete:
      rabbitmq-server_standard:
      sed_bins:
      util-linux_su-support:
    contents:
      /usr/lib/ocf/resource.d/rabbitmq/rabbitmq-server:
      /usr/lib/rabbitmq/bin/rabbitmq-script-wrapper: {mutable: true}
      /usr/lib/rabbitmq/bin/vmware-rabbitmq:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/escript/vmware-rabbitmq:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/sbin/vmware-rabbitmq:
      /usr/sbin/rabbitmq-diagnostics:
      /usr/sbin/rabbitmq-plugins:  # Symlink to ../lib/rabbitmq/bin/rabbitmq-script-wrapper
      /usr/sbin/rabbitmq-queues:
      /usr/sbin/rabbitmq-server:  # Symlink to ../lib/rabbitmq/bin/rabbitmq-script-wrapper
      /usr/sbin/rabbitmq-streams:
      /usr/sbin/rabbitmq-upgrade:
      /usr/sbin/rabbitmqctl:  # Symlink to ../lib/rabbitmq/bin/rabbitmq-script-wrapper
    # The wrapper asks dpkg for the package version to find the plugins
    # directory, and a chiselled rootfs has no dpkg database to answer; replace
    # that shell expression in the script with the version itself.
    mutate: |
      wrapper = "/usr/lib/rabbitmq/bin/rabbitmq-script-wrapper"
      dpkg_expr = "$(dpkg-query -W rabbitmq-server | awk '{print $2}' | cut -d- -f1)"
      prefix = "rabbitmq_server-"
      dirs = content.list("/usr/lib/rabbitmq/lib/")
      versions = [d[len(prefix):-1] for d in dirs if d.startswith(prefix)]
      if len(versions) != 1:
        fail("expected one rabbitmq_server directory, found %s" % versions)
      script = content.read(wrapper)
      if dpkg_expr not in script:
        fail("rabbitmq-script-wrapper no longer finds the plugins directory with dpkg-query")
      content.write(wrapper, script.replace(dpkg_expr, versions[0]))

  autocomplete:
    contents:
      /usr/lib/rabbitmq/autocomplete/*:

  config:
    contents:
      /etc/rabbitmq/rabbitmq-env.conf:
        copy: /usr/share/rabbitmq/rabbitmq-env.conf
        mode: 0644

  # Every erlang application the package ships, the optional plugins included.
  modules:
    hint: All plugins
    essential:
      erlang-crypto_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-eldap_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-inets_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-mnesia_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-os-mon_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-public-key_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-runtime-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-ssl_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-syntax-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-tools_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
      erlang-xmerl_modules: {arch: [amd64, arm64, armhf, ppc64el, riscv64, s390x]}
    contents:
      /usr/lib/rabbitmq/lib/rabbitmq_server-*/plugins/**:

  copyright:
    contents:
      /usr/share/doc/rabbitmq-server/copyright:
