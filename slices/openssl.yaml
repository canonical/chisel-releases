package: openssl

essential:
  - openssl_copyright

slices:
  bins:
    essential:
      # TODO: remove openssl_c-rehash in a future release.
      - openssl_c-rehash
      - openssl_openssl

  openssl:
    essential:
      - libc6_config
      - libc6_libs
      - libssl3t64_libs
      - openssl_config
      - openssl_data
    contents:
      /usr/bin/openssl:

  # c_rehash is a perl script that runs the openssl binary.
  c-rehash:
    essential:
      - openssl_openssl
      - perl-base_bins
    contents:
      /usr/bin/c_rehash:

  scripts:
    essential:
      - openssl_c-rehash

  config:
    contents:
      # TODO: this is not a config, but data. Remove it for future releases.
      /etc/ssl/certs/:
      /etc/ssl/openssl.cnf:
      # TODO: this is not a config, but data. Remove it for future releases.
      /etc/ssl/private/:
      # TODO: this is not a config, but data. Remove it for future releases.
      /usr/lib/ssl/certs:
      /usr/lib/ssl/openssl.cnf:
      # TODO: this is not a config, but data. Remove it for future releases.
      /usr/lib/ssl/private:

  data:
    contents:
      /etc/ssl/certs/:
      /etc/ssl/private/:
      /usr/lib/ssl/cert.pem:
      /usr/lib/ssl/certs:
      /usr/lib/ssl/private:

  copyright:
    essential:
      - libssl3t64_copyright
    contents:
      /usr/share/doc/openssl/copyright:
