package: libdaemon-dev

essential:
  libdaemon-dev_copyright:

slices:
  libs:
    hint: Static library and linker symlink
    essential:
      libdaemon0_libs:
    contents:
      /usr/lib/*-linux-*/libdaemon.a:
      /usr/lib/*-linux-*/libdaemon.so:  # Symlink to libdaemon.so.0.* from libdaemon0

  headers:
    hint: C headers for libdaemon
    contents:
      /usr/include/libdaemon/daemon.h:
      /usr/include/libdaemon/dexec.h:
      /usr/include/libdaemon/dfork.h:
      /usr/include/libdaemon/dlog.h:
      /usr/include/libdaemon/dnonblock.h:
      /usr/include/libdaemon/dpid.h:
      /usr/include/libdaemon/dsignal.h:

  copyright:
    contents:
      /usr/share/doc/libdaemon-dev/copyright:
