package: libdrm2

essential:
  libdrm2_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      # TODO: libdrm.so.2 does not read amdgpu.ids, only libdrm_amdgpu.so.1 does, so this is
      # likely not needed here. Remove it in the next release.
      libdrm-common_data:
    contents:
      /usr/lib/*-linux-*/libdrm.so.2*:

  copyright:
    contents:
      /usr/share/doc/libdrm2/copyright:
