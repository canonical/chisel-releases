package: openssh-server

essential:
  openssh-server_copyright:

slices:
  bins:
    # The sshd privilege separation user must be created after cutting this slice:
    #   useradd -R "$rootfs" -r -g nogroup -d /run/sshd -s /usr/sbin/nologin sshd
    essential:
      libaudit1_libs:
      libc6_libs:
      libcom-err2_libs:
      libcrypt1_libs:
      libgssapi-krb5-2_libs:
      libkrb5-3_libs:
      libpam-modules_libs:
      libpam-runtime_config:
      libpam0g_libs:
      libselinux1_libs:
      libssl3t64_libs:
      libwrap0_libs:
      openssh-client_bins:
      # TODO: ssh-session-cleanup is here for backwards-compatibility
      # remove in next release
      openssh-server_ssh-session-cleanup:
      openssh-sftp-server_bins:
      zlib1g_libs:
    contents:
      # OpenSSH 9.8 (Ubuntu 25.04) split sshd-session from the sshd listener;
      # OpenSSH 10.0 (Ubuntu 25.10) split authentication into sshd-auth.
      # All three are needed to serve SSH connections.
      /run/sshd/: {make: true, mode: 0755}
      /usr/lib/openssh/sshd-auth:
      /usr/lib/openssh/sshd-session:
      /usr/sbin/sshd:

  scripts:
    essential:
      openssh-server_ssh-session-cleanup:

  ssh-session-cleanup:
    essential:
      base-files_bin:
      dash_bins:
      procps_bins:
    contents:
      /usr/lib/openssh/ssh-session-cleanup:

  config:
    contents:
      /etc/pam.d/sshd:
      /etc/ssh/moduli:
      /etc/ssh/sshd_config: {copy: /usr/share/openssh/sshd_config}
      /etc/ssh/sshd_config.d/:
      /etc/ufw/applications.d/openssh-server:
      /usr/lib/sysusers.d/openssh-server.conf:
      /usr/share/openssh/sshd_config:
      /usr/share/openssh/sshd_config.md5sum:

  services:
    essential:
      init-system-helpers_scripts:
      openssh-server_bins:
      openssh-server_socket-generator:
    contents:
      /usr/lib/systemd/system/rescue-ssh.target:
      /usr/lib/systemd/system/ssh.service:
      /usr/lib/systemd/system/ssh.socket:

  socket-generator:
    hint: Listen settings for ssh.socket
    essential:
      libaudit1_libs:
      libc6_libs:
      libcom-err2_libs:
      libssl3t64_libs:
      openssh-server_config:
      zlib1g_libs:
    contents:
      /usr/lib/systemd/system-generators/sshd-socket-generator:

  copyright:
    essential:
      openssh-client_copyright:
    contents:
      /usr/share/doc/openssh-server:
