package: libbrotli1

essential:
  - libbrotli1_copyright

slices:
  libs:
    essential:
      - libc6_libs
    contents:
      /usr/lib/*-linux-*/libbrotlicommon.so.1*:
      /usr/lib/*-linux-*/libbrotlidec.so.1*:
      /usr/lib/*-linux-*/libbrotlienc.so.1*:

  brotlicommon:
    essential:
      - libc6_libs
    contents:
      /usr/lib/*-linux-*/libbrotlicommon.so.1*:

  brotlidec:
    essential:
      - libbrotli1_brotlicommon
      - libc6_libs
    contents:
      /usr/lib/*-linux-*/libbrotlidec.so.1*:

  brotlienc:
    essential:
      - libbrotli1_brotlicommon
      - libc6_libs
    contents:
      /usr/lib/*-linux-*/libbrotlienc.so.1*:

  copyright:
    contents:
      /usr/share/doc/libbrotli1/copyright:
