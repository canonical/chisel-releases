package: libgcc-11-dev

essential:
  - libgcc-11-dev_copyright

slices:
  # Runtime objects for linking with gcc-11
  # The {e,n}crti.o and {e,n}crtn.o files are the startup
  # https://gcc.gnu.org/legacy-ml/gcc-patches/2009-01/msg01151.html
  runtime:
    contents:
      /usr/lib/gcc/*-linux-*/11/crtbegin.o:
      /usr/lib/gcc/*-linux-*/11/crtbeginS.o:
      /usr/lib/gcc/*-linux-*/11/crtbeginT.o:
      /usr/lib/gcc/*-linux-*/11/crtend.o:
      /usr/lib/gcc/*-linux-*/11/crtendS.o:
      /usr/lib/gcc/*-linux-*/11/crtfastmath.o:
        arch: [amd64, arm64]
      /usr/lib/gcc/*-linux-*/11/crtoffloadbegin.o:
        arch: [amd64, ppc64el]
      /usr/lib/gcc/*-linux-*/11/crtoffloadend.o:
        arch: [amd64, ppc64el]
      /usr/lib/gcc/*-linux-*/11/crtoffloadtable.o:
        arch: [amd64, ppc64el]
      /usr/lib/gcc/*-linux-*/11/crtprec32.o:
        arch: [amd64]
      /usr/lib/gcc/*-linux-*/11/crtprec64.o:
        arch: [amd64]
      /usr/lib/gcc/*-linux-*/11/crtprec80.o:
        arch: [amd64]
      /usr/lib/gcc/*-linux-*/11/ecrti.o:
        arch: [ppc64el]
      /usr/lib/gcc/*-linux-*/11/ecrtn.o:
        arch: [ppc64el]
      /usr/lib/gcc/*-linux-*/11/ncrti.o:
        arch: [ppc64el]
      /usr/lib/gcc/*-linux-*/11/ncrtn.o:
        arch: [ppc64el]

  core:
    essential:
      - libgcc-11-dev_runtime
      - libgcc-s1_libs
    contents:
      /usr/lib/gcc/*-linux-*/11/libgcc.a:
      # linker script which links to libgcc_s.so.1 from libgcc-s1 and adds -lgcc as a link option
      /usr/lib/gcc/*-linux-*/11/libgcc_s.so:

  headers:
    contents:
      /usr/lib/gcc/*-linux-*/11/include/*.h:

  copyright:
    essential:
      - gcc-11-base_copyright
    contents:
      # Symlink to gcc-11-base
      /usr/share/doc/libgcc-11-dev:
