package: rustfmt-1.97

essential:
  rustfmt-1.97_copyright:

slices:
  cargo-fmt:
    essential:
      # NOTE: although libc6_libs and libgcc-s1_libs
      # are transitively included by depending on
      # rustfmt-1.97_rustfmt, we also declare them
      # here since are also direct dependencies for
      # cargo-fmt
      libc6_libs:
      libgcc-s1_libs:
      rustfmt-1.97_rustfmt:  # needs rustfmt bin
    contents:
      /usr/lib/rust-1.97/bin/cargo-fmt:

  rustfmt:
    essential:
      libc6_libs:
      libgcc-s1_libs:
      libstd-rust-1.97-dev_libs:
    contents:
      /usr/lib/rust-1.97/bin/rustfmt:

  copyright:
    contents:
      /usr/share/doc/rustfmt-1.97/copyright:
