package: libqt5widgets5t64

essential:
  - libqt5widgets5t64_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libqt5core5t64_libs
      - libqt5gui5t64_libs
      - libstdc++6_libs
    v3-essential:
      libgcc-s1_libs: {arch: [amd64, armhf, i386, riscv64]}
    contents:
      /usr/lib/*-linux-*/libQt5Widgets.so.5*:

  copyright:
    contents:
      /usr/share/doc/libqt5widgets5t64/copyright:
