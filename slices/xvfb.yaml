package: xvfb

essential:
  - xvfb_copyright

slices:
  bins:
    essential:
      - coreutils_bins
      - gawk_bins
      - util-linux_cli-helpers
      - util-linux_mcookie
      - xauth_bins
      - xvfb_server
    contents:
      /usr/bin/xvfb-run:

  server:
    essential:
      - base-files_bin
      - base-files_tmp
      # Xvfb invokes xkbcomp through /bin/sh when initializing the keyboard.
      - dash_bins
      - libaudit1_libs
      - libbsd0_libs
      - libc6_libs
      - libgcrypt20_libs
      - libgl1_libs
      - libpixman-1-0_libs
      - libselinux1_libs
      - libsystemd0_libs
      - libxau6_libs
      - libxdmcp6_libs
      - libxfont2_libs
      - x11-xkb-utils_xkbcomp
      - xkb-data_data
      - xserver-common_data
    # Chisel < 1.3 silently ignores this block, leaving Xvfb unable to start
    # on the listed architectures because libunwind.so.8 is missing.
    v3-essential:
      libunwind8_libs: {arch: [amd64, arm64, armhf, i386, ppc64el]}
    contents:
      /usr/bin/Xvfb:

  copyright:
    contents:
      /usr/share/doc/xvfb/copyright:
