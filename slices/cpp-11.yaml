package: cpp-11

essential:
  - cpp-11_copyright

slices:
  cc1:
    essential:
      - libc6_libs
      - libgmp10_libs
      - libisl23_libs
      - libmpc3_libs
      - libmpfr6_libs
      - libzstd1_libs
      - zlib1g_libs
    contents:
      /usr/lib/gcc/aarch64-linux-gnu/11/cc1:
        arch: [arm64]
      /usr/lib/gcc/powerpc64le-linux-gnu/11/cc1:
        arch: [ppc64el]
      /usr/lib/gcc/s390x-linux-gnu/11/cc1:
        arch: [s390x]
      /usr/lib/gcc/x86_64-linux-gnu/11/cc1:
        arch: [amd64]

  copyright:
    essential:
      - gcc-11-base_copyright
    contents:
      /usr/share/doc/cpp-11:  # Symlink to gcc-11-base
